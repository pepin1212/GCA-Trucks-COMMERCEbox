<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0c0f">
<link rel="manifest" href="manifest.json">
<title>DAF_COMMERCE-Box</title>
<script src="xlsx.full.min.js" onerror="window._xlsxLoadError=true;"></script>
<style>
:root{--bg:#0a0c0f;--bg2:#111418;--bg3:#1a1e24;--bg4:#222830;--border:#2a3040;--border2:#3a4255;--text:#e8eaf0;--text2:#a0a8b8;--text3:#606880;--daf:#e8a020;--daf2:#f0b840;--daf-bg:rgba(232,160,32,.12);--daf-border:rgba(232,160,32,.3);--blue:#4a90d9;--blue-bg:rgba(74,144,217,.12);--green:#3ab87a;--green-bg:rgba(58,184,122,.12);--red:#e05050;--red-bg:rgba(224,80,80,.12);--orange:#e07830;--orange-bg:rgba(224,120,48,.12);--purple:#8060d0;--purple-bg:rgba(128,96,208,.12);--radius:12px;--radius-sm:8px;--nav-h:68px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,"SF Pro Display","Helvetica Neue",sans-serif;font-size:14px}
#app{width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden}
.screen{display:none;flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(var(--nav-h) + var(--safe-b) + 8px);-webkit-overflow-scrolling:touch}
.screen.active{display:block}
#nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + var(--safe-b));background:rgba(10,12,15,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;align-items:flex-start;padding-top:8px;z-index:100}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:0 2px;cursor:pointer;transition:all .2s}
.nav-icon{font-size:22px;line-height:1}
.nav-label{font-size:9px;font-weight:600;letter-spacing:.3px;color:var(--text3);text-transform:uppercase}
.nav-item.active .nav-label{color:var(--daf)}
.nav-item.active .nav-icon{transform:translateY(-1px)}
.screen-header{padding:10px 14px 6px;position:sticky;top:0;background:var(--bg);z-index:10;border-bottom:1px solid var(--border)}
.screen-title{font-size:19px;font-weight:700;display:flex;align-items:center;gap:7px}
.screen-sub{font-size:10px;color:var(--text3);margin-top:1px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 13px;margin:0 12px 9px}
.card-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);margin-bottom:8px}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:0 12px 9px}
.kpi-grid-3{grid-template-columns:1fr 1fr 1fr}
.marche-kpi-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 12px 9px}
.marche-kpi-side-lbl{font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
.kpi-col-stack{grid-template-columns:1fr!important;margin:0!important}
.kpi-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:10px 9px;cursor:pointer;transition:all .15s}
.kpi-card:active{transform:scale(.97)}
.kpi-card.active{border-color:var(--daf);background:var(--daf-bg)}
.kpi-val{font-size:22px;font-weight:800;line-height:1;color:var(--text)}
.kpi-lbl{font-size:9px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-top:2px}
.kpi-card.c-daf .kpi-val{color:var(--daf)}.kpi-card.c-green .kpi-val{color:var(--green)}.kpi-card.c-blue .kpi-val{color:var(--blue)}.kpi-card.c-red .kpi-val{color:var(--red)}.kpi-card.c-orange .kpi-val{color:var(--orange)}.kpi-card.c-purple .kpi-val{color:var(--purple)}
.badge{display:inline-flex;align-items:center;padding:2px 6px;border-radius:20px;font-size:8px;font-weight:800;letter-spacing:.4px;text-transform:uppercase}
.b-daf{background:var(--daf-bg);color:var(--daf);border:1px solid var(--daf-border)}
.b-flotte{background:rgba(255,230,0,.22);color:#ffe600;border:1px solid rgba(255,230,0,.7)}
.b-conc{background:var(--blue-bg);color:var(--blue);border:1px solid rgba(74,144,217,.3)}
.b-urgent{background:var(--red-bg);color:var(--red);border:1px solid rgba(224,80,80,.3)}
.b-projet{background:var(--green-bg);color:var(--green);border:1px solid rgba(58,184,122,.3)}
.client-row{display:flex;align-items:center;padding:10px 13px;background:var(--bg2);border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.client-row:active{background:var(--bg3)}
.c-info{flex:1;min-width:0}
.c-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-sub{font-size:10px;color:var(--text3);margin-top:1px}
.c-badges{display:flex;gap:3px;flex-wrap:wrap;margin-top:3px}
.c-score{display:flex;flex-direction:column;align-items:flex-end;min-width:40px}
.score-val{font-size:17px;font-weight:800;color:var(--daf)}
.score-lbl{font-size:8px;color:var(--text3)}
.sec-hdr{padding:8px 13px;background:var(--bg3);border-bottom:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:space-between}
.sec-hdr-title{font-size:13px;font-weight:700}
.sec-chevron{font-size:10px;color:var(--text3);transition:transform .2s}
.sec-open .sec-chevron{transform:rotate(90deg)}
.subsec-hdr{padding:6px 13px 6px 22px;background:var(--bg2);border-bottom:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:space-between}
.search-bar{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:9px 13px;margin:7px 12px}
.search-bar input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:15px}
.search-bar input::placeholder{color:var(--text3)}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:9px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:700;border:none;cursor:pointer;transition:all .15s;gap:5px}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--daf);color:#000}.btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border2)}.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}.btn-green{background:var(--green);color:#fff}.btn-red{background:var(--red);color:#fff}.btn-blue{background:var(--blue);color:#fff}.btn-orange{background:var(--orange);color:#fff}
.btn-sm{padding:5px 10px;font-size:11px}
input[type=file]{display:none}
.file-zone{border:2px dashed var(--border2);border-radius:var(--radius);padding:16px;text-align:center;margin:0 0 8px;cursor:pointer;transition:all .2s}
.file-zone:active{border-color:var(--daf);background:var(--daf-bg)}
.fz-title{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:2px}
.fz-sub{font-size:10px;color:var(--text3)}
#sheet-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:200}
#sheet-ov.open{display:block}
#sheet{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-radius:20px 20px 0 0;z-index:201;max-height:93vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1)}
#sheet.open{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:10px auto 0}
.sheet-hdr{padding:11px 14px 9px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.sheet-title{font-size:16px;font-weight:700}
.sheet-close{width:27px;height:27px;border-radius:50%;background:var(--bg3);border:none;color:var(--text2);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 0 calc(var(--safe-b) + 10px)}
#modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:300;align-items:center;justify-content:center;padding:18px}
#modal-ov.open{display:flex}
#modal{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;width:100%;max-width:360px;max-height:84vh;display:flex;flex-direction:column}
.modal-hdr{padding:13px 15px;border-bottom:1px solid var(--border)}
.modal-title{font-size:15px;font-weight:700}
.modal-body{flex:1;overflow-y:auto;padding:13px 15px}
.modal-foot{padding:10px 13px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.form-group{margin-bottom:11px}
.form-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);margin-bottom:4px;display:block}
.form-input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;color:var(--text);font-size:14px;outline:none}
.form-input:focus{border-color:var(--daf)}
.form-textarea{resize:vertical;min-height:66px}
#toast{position:fixed;top:max(16px,calc(var(--safe-t)+10px));left:50%;transform:translateX(-50%) translateY(-100px);background:var(--bg4);border:1px solid var(--border2);color:var(--text);padding:8px 16px;border-radius:20px;font-size:12px;font-weight:600;z-index:999;transition:transform .28s;white-space:nowrap;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0)}
.v-row{padding:8px 13px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.v-info{flex:1;min-width:0}
.v-plaque{font-size:11px;font-weight:700;font-family:"Courier New",monospace;color:var(--text)}
.v-detail{font-size:9px;color:var(--text3);margin-top:1px}
.poss-btn{padding:3px 8px;border-radius:20px;font-size:8px;font-weight:800;border:none;cursor:pointer}
.p-oui{background:var(--green-bg);color:var(--green);border:1px solid rgba(58,184,122,.4)}
.p-non{background:var(--red-bg);color:var(--red);border:1px solid rgba(224,80,80,.4)}
.proj-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;margin:0 12px 7px;cursor:pointer;transition:background .15s}
.proj-card:active{background:var(--bg3)}
.proj-status{font-size:9px;font-weight:800;padding:2px 6px;border-radius:10px;display:inline-block;margin-bottom:4px;text-transform:uppercase}
.s-encours{background:var(--blue-bg);color:var(--blue)}.s-futur{background:var(--purple-bg);color:var(--purple)}.s-gagne{background:var(--green-bg);color:var(--green)}.s-perdu{background:var(--red-bg);color:var(--red)}.s-reporte{background:var(--orange-bg);color:var(--orange)}
.diag-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)}
.diag-lbl{font-size:11px;color:var(--text2)}
.diag-val{font-size:11px;font-weight:700}
.d-ok{color:var(--green)}.d-warn{color:var(--orange)}.d-err{color:var(--red)}
.filter-row{display:flex;gap:5px;overflow-x:auto;padding:5px 12px;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.fpill{padding:4px 10px;border-radius:20px;font-size:10px;font-weight:700;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);white-space:nowrap;cursor:pointer;transition:all .15s}
.fpill.active{background:var(--daf-bg);border-color:var(--daf);color:var(--daf)}
.mkt-row{padding:6px 0}.mkt-brand{display:flex;justify-content:space-between;margin-bottom:3px}.mkt-name{font-size:11px;font-weight:600;color:var(--text2)}.mkt-count{font-size:11px;font-weight:700}
.mkt-bar-wrap{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden}
.mkt-bar{height:100%;border-radius:3px;transition:width .4s}
.rank-row{display:flex;align-items:center;padding:8px 13px;border-bottom:1px solid var(--border);gap:8px;cursor:pointer}
.rank-row:active{background:var(--bg3)}
.rank-num{font-size:12px;font-weight:800;color:var(--text3);width:18px}
.rank-info{flex:1;min-width:0}
.rank-bar-wrap{height:3px;background:var(--bg3);border-radius:2px;margin-top:2px;overflow:hidden}
.rank-bar{height:100%;border-radius:2px}
.hist-row{padding:8px 13px;border-bottom:1px solid var(--border);position:relative}
.hist-date{font-size:9px;color:var(--text3);margin-bottom:1px}
.hist-text{font-size:11px;color:var(--text2)}
.hist-del{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:var(--red-bg);color:var(--red);border:none;border-radius:50%;width:20px;height:20px;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.pdm-circle{display:flex;flex-direction:column;align-items:center;justify-content:center;width:84px;height:84px;border-radius:50%;border:4px solid var(--daf);margin:0 auto 10px}
.pdm-pct{font-size:20px;font-weight:800;color:var(--daf)}
.pdm-lbl{font-size:8px;color:var(--text3);font-weight:600;text-transform:uppercase}
.empty-state{text-align:center;padding:46px 20px;color:var(--text3)}
.empty-icon{font-size:40px;margin-bottom:9px}
.empty-title{font-size:14px;font-weight:600;color:var(--text2);margin-bottom:4px}
.obj-bar-wrap{margin:6px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:9px 11px}
.obj-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.obj-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text3)}
.obj-pct{font-size:12px;font-weight:800;color:var(--daf)}
.obj-track{height:7px;background:var(--bg3);border-radius:4px;overflow:hidden;position:relative}
.obj-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--daf),var(--daf2));transition:width .5s}
.obj-target-line{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.3);left:15%}
.gf-bar{background:var(--bg2);border-bottom:1px solid var(--border);padding:6px 12px;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;align-items:center;flex-shrink:0}
.gf-bar::-webkit-scrollbar{display:none}
.gf-chip{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:20px;font-size:9px;font-weight:700;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);white-space:nowrap;cursor:pointer;transition:all .15s}
.gf-chip.on{background:var(--daf-bg);border-color:var(--daf);color:var(--daf)}
.gf-chip.mask-exclude{background:var(--orange-bg);border-color:var(--orange);color:var(--orange)}
.gf-chip.mask-only{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.gf-chip.disabled{opacity:.4;pointer-events:none}
.save-bar{display:flex;align-items:center;gap:5px;font-size:9px;color:var(--text3);padding:3px 0}
.save-dot{width:5px;height:5px;border-radius:50%;background:var(--text3)}
.save-dot.ok{background:var(--green)}.save-dot.warn{background:var(--orange)}.save-dot.err{background:var(--red)}
.toggle{position:relative;width:40px;height:23px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.tgl-sl{position:absolute;inset:0;background:var(--bg3);border-radius:12px;border:1px solid var(--border);cursor:pointer;transition:.2s}
.tgl-sl:before{content:"";position:absolute;width:17px;height:17px;left:2px;top:2px;background:var(--text3);border-radius:50%;transition:.2s}
.toggle input:checked+.tgl-sl{background:var(--daf);border-color:var(--daf)}
.toggle input:checked+.tgl-sl:before{transform:translateX(17px);background:#000}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0}
.toggle-lbl{font-size:12px;color:var(--text2)}
.sep{height:1px;background:var(--border);margin:5px 0}
.daf-logo{font-size:11px;font-weight:900;letter-spacing:2px;color:var(--daf)}
.base-item{display:flex;align-items:center;padding:10px 13px;border-bottom:1px solid var(--border);gap:8px;cursor:pointer}
.base-dot{width:8px;height:8px;border-radius:50%}
.base-dot.on{background:var(--daf)}.base-dot.off{background:var(--text3)}
.xlsx-missing{background:var(--red-bg);border:1px solid rgba(224,80,80,.3);border-radius:var(--radius);padding:12px;margin:0 12px 9px}
.ville-counts{display:flex;gap:6px;padding:2px 0 4px 22px;font-size:8px;color:var(--text3)}
.vc-item{display:flex;align-items:center;gap:2px}
#nav-save-btn .nav-icon{transition:transform .2s}
#nav-save-btn:active .nav-icon{transform:scale(.85)}
@keyframes pulse-save{0%,100%{opacity:1}50%{opacity:.4}}
.nav-save-pulse{animation:pulse-save 1.2s ease-in-out infinite}
.gf-btn{display:inline-flex;align-items:center;padding:4px 9px;border-radius:20px;font-size:9px;font-weight:700;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);white-space:nowrap;cursor:pointer;transition:all .15s}
.gf-btn.gf-on{background:var(--daf-bg);border-color:var(--daf);color:var(--daf)}
.gf-chip-opt{display:inline-flex;align-items:center;padding:3px 8px;border-radius:12px;font-size:9px;font-weight:600;border:1px solid var(--border);background:var(--bg3);color:var(--text3);cursor:pointer;transition:all .15s;white-space:nowrap}
.gf-chip-opt.on{background:var(--daf-bg);border-color:var(--daf);color:var(--daf)}
.gf-sel{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text2);cursor:pointer;transition:all .15s;appearance:none;-webkit-appearance:none;}
.gf-sel-active{background:var(--daf-bg);border-color:var(--daf);color:var(--daf);}
.gf-sel option{background:var(--bg3);color:var(--text);}
.brand-logo{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;line-height:0;flex-shrink:0}
.brand-logo svg{display:block;max-height:22px;width:auto}
</style>

<body>
<div id="app">
<div class="screen active" id="screen-marche">
  <div class="screen-header">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <div><div class="screen-title"><span class="daf-logo">DAF</span> CommerceBox</div><div class="screen-sub" id="marche-sub">Chargez vos fichiers Excel</div></div>
      <div style="display:flex;gap:6px;align-items:center;">
        <div class="save-bar"><div class="save-dot" id="save-dot"></div><span id="save-lbl">—</span></div>
        <button class="btn btn-secondary btn-sm" id="btn-base-hdr">🗂 <span id="base-name-hdr">Base 1</span></button>
      </div>
    </div>
  </div>
  <div id="marche-content" style="padding-top:6px;"></div>
</div>

<div class="screen" id="screen-tours">
  <div class="screen-header">
    <div class="screen-title">🗺 Tournées</div>
  </div>
  <div class="search-bar"><span>🔍</span><input type="text" id="tours-search" placeholder="Client, ville, canton, vendeur…"></div>
  <div class="filter-row" id="tours-fpills" style="position:sticky;top:0;z-index:10;background:var(--bg2);">
    <div class="fpill active" data-f="all">Tous</div>
    <div class="fpill" data-f="daf_with">Avec DAF</div>
    <div class="fpill" data-f="no_daf">Sans DAF</div>
    <div class="fpill" data-f="urgent">Urgents</div>
    <div class="fpill fpill-alert" data-f="orphan_immat" title="Immatriculations sans fiche client CRM">⚠ Sans fiche</div>
    <div class="fpill" data-f="flotte">Flotte</div>
  </div>
  <div id="tours-mask-bar" style="display:flex;align-items:center;flex-wrap:wrap;gap:5px;padding:6px 12px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:40px;z-index:200;overflow:visible;">
    <button class="gf-chip" id="btn-mask-exclus">Exclus</button>
    <button class="gf-chip" id="btn-mask-accessible-off">Accessible OFF</button>
    <button class="gf-chip mask-exclude" id="btn-mask-inactifs">Inactifs OFF</button>
    <button class="gf-chip" id="btn-mask-flotte-nat">Flotte Nat. OFF</button>
    <button class="gf-chip mask-exclude" id="btn-mask-projets">Projets OFF</button>
    <button class="gf-chip mask-exclude" id="btn-mask-sites-sec">Sites sec. OFF</button>
    <select class="form-input" id="tours-sort-sel" style="font-size:10px;padding:4px 7px;min-width:110px;">
      <option value="score">Score &#9660;</option>
      <option value="parc_desc">Parc total &#9660;</option>
      <option value="parc_asc">Parc total &#9650;</option>
      <option value="nom_asc">Nom A&#8594;Z</option>
      <option value="renew_desc">Renouvellement &#9660;</option>

<script>
// ============================================================
// DAF PRO V5 PREMIUM TERRAIN — JAVASCRIPT CORE
// ============================================================
const APP_BUILD='2026-05-27-bases-v48';
const YEAR=(new Date()).getFullYear();
const INACTIVE_PURCHASE_YEARS=6; // inactif = aucun achat (immat.) sur les 6 dernières années calendaires, année courante incluse
const PDM_GOAL = 15; // objectif 15%
const BRAND_COLORS = {DAF:'#e8a020',VOLVO:'#4488CC',MERCEDES:'#888',SCANIA:'#CC3333',MAN:'#4a90d9',RENAULT:'#DDAA00',IVECO:'#E07830','MERCEDES-BENZ':'#888'};

// ===== DEBOUNCE =====
function debounce(fn, ms) {
  var _dt; return function() { var _da=arguments; clearTimeout(_dt); _dt=setTimeout(function(){fn.apply(null,_da);}, ms); };
}

// ===== UTILS =====
var $ = function(id){return document.getElementById(id);};
var QA = function(s){return document.querySelectorAll(s);};
function safeOn(id,evt,fn){var el=typeof id==='string'?document.getElementById(id):id;if(el)el.addEventListener(evt,fn);}
function toast(msg, dur) { if(dur===undefined)dur=2400;
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),dur);
}
function escH(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtDate(d){if(!d)return '—';const dt=new Date(d);if(isNaN(dt))return String(d);return dt.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'});}
function getYear(d){if(!d)return null;const y=typeof d==='number'?new Date(Math.round((d-25569)*86400000)).getFullYear():new Date(d).getFullYear();return isNaN(y)?null:y;}
function parseDate(d){
  if(!d)return null;
  if(typeof d==='number'){return new Date(Math.round((d-25569)*86400000)).toISOString().split('T')[0];}
  let s=String(d).trim();
  if(/^\d{2}\/\d{2}\/\d{4}$/.test(s)){var _dparts=s.split('/');return _dparts[2]+'-'+_dparts[1]+'-'+_dparts[0];}
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.split('T')[0];
  if(/^\d{2}-\d{2}-\d{4}$/.test(s)){var _dparts2=s.split('-');return _dparts2[2]+'-'+_dparts2[1]+'-'+_dparts2[0];}
  const dt=new Date(s); return isNaN(dt)?null:dt.toISOString().split('T')[0];
}
function norm(s){return String(s||'').trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
// Normalise un SIRET : supprime espaces, tirets, points, gere notation scientifique Excel
function normSiret(s){
  if(!s&&s!==0)return '';
  var str=String(s).trim();
  if(/^[\d.]+[eE][+\-]?\d+$/.test(str)){try{str=Number(str).toFixed(0);}catch(e){}}
  str=str.replace(/\.0+$/,'');
  str=str.replace(/[\s\.\-]/g,'');
  if(/^\d+$/.test(str)&&str.length<14){str=str.padStart(14,'0');}
  return str;
}
function siretSiren(s){var n=normSiret(s);return n.length>=9?n.slice(0,9):'';}
function normClientName(s){return norm(String(s||'').replace(/\s+/g,' '));}
function resolveClientForVehicle(v){
  if(!v||!IDX)return null;
  var _vsiret=normSiret(v.siret);
  if(_vsiret&&IDX.cBySiret&&IDX.cBySiret[_vsiret])return IDX.cBySiret[_vsiret];
  if(v.tva){
    var sitesTva=(IDX.sitesByTva&&IDX.sitesByTva[v.tva])||[];
    if(sitesTva.length===1)return sitesTva[0];
  }
  var siren=siretSiren(_vsiret);
  var cands=siren&&IDX.cBySiren?IDX.cBySiren[siren]:null;
  if(cands&&cands.length){
    if(cands.length===1)return cands[0];
    if(v.tva){
      var byTva=cands.filter(function(c){return String(c.tva||'')===String(v.tva||'');});
      if(byTva.length===1)return byTva[0];
      if(byTva.length>1)cands=byTva;
    }
    var vn=normClientName(v.client||v.nom||'');
    if(vn){
      var byName=cands.filter(function(c){var cn=normClientName(c.nom);return cn&&(cn===vn||cn.indexOf(vn)>=0||vn.indexOf(cn)>=0);});
      if(byName.length===1)return byName[0];
    }
    if(v.ville){
      var byVille=cands.filter(function(c){return norm(c.ville)===norm(v.ville);});
      if(byVille.length===1)return byVille[0];
    }
  }
  if(v.tva){
    var vn2=normClientName(v.client||'');
    if(vn2){
      var tvaSites=(IDX.sitesByTva&&IDX.sitesByTva[v.tva])||[];
      var byNameTva=tvaSites.filter(function(c){var cn=normClientName(c.nom);return cn&&(cn===vn2||cn.indexOf(vn2)>=0||vn2.indexOf(cn)>=0);});
      if(byNameTva.length===1)return byNameTva[0];
    }
  }
  return null;
}

// ===== STORAGE (IndexedDB véhicules + localStorage reste) =====
const DB = (() => {
  const IDB_NAME = 'daf_commercebox_db';
  const IDB_VER = 1;
  const VEH_CHUNK = 1200;
  let _idb = null;
  let _memVehicles = null;
  let _memVehiclesBase = null;
  const LS = {
    get(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}},
    set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}},
    del(k){try{localStorage.removeItem(k);}catch(e){}}
  };
  function idbOpen(){
    return new Promise(function(resolve){
      if(typeof indexedDB==='undefined'){resolve(null);return;}
      try{
        var req=indexedDB.open(IDB_NAME,IDB_VER);
        req.onupgradeneeded=function(e){var db=e.target.result;if(!db.objectStoreNames.contains('store'))db.createObjectStore('store');};
        req.onsuccess=function(){_idb=req.result;resolve(_idb);};
        req.onerror=function(){resolve(null);};
      }catch(e){resolve(null);}
    });
  }
  function idbGet(key){
    return new Promise(function(resolve){
      if(!_idb){resolve(null);return;}
      try{
        var tx=_idb.transaction('store','readonly');
        var rq=tx.objectStore('store').get(key);
        rq.onsuccess=function(){resolve(rq.result);};
        rq.onerror=function(){resolve(null);};
      }catch(e){resolve(null);}
    });
  }
  function idbSet(key,val){
    return new Promise(function(resolve){
      if(!_idb){resolve(false);return;}
      try{
        var tx=_idb.transaction('store','readwrite');
        tx.objectStore('store').put(val,key);
        tx.oncomplete=function(){resolve(true);};
        tx.onerror=function(){resolve(false);};
      }catch(e){resolve(false);}
    });
  }
  function idbDel(key){
    return new Promise(function(resolve){
      if(!_idb){resolve();return;}
      try{
        var tx=_idb.transaction('store','readwrite');
        tx.objectStore('store').delete(key);
        tx.oncomplete=function(){resolve();};
        tx.onerror=function(){resolve();};
      }catch(e){resolve();}
    });
  }
  function _vehIdbKey(base){return 'vehicles_'+base;}
  function _purgeVehicleChunks(baseId){
    var meta=LS.get('daf_pro_'+baseId+'_vehicles_meta');
    if(meta&&meta.chunks){for(var i=0;i<meta.chunks;i++)LS.del('daf_pro_'+baseId+'_vehicles_'+i);}
    LS.del('daf_pro_'+baseId+'_vehicles_meta');
    LS.del('daf_pro_'+baseId+'_vehicles');
  }
  function _loadVehiclesLegacy(baseId){
    var single=LS.get('daf_pro_'+baseId+'_vehicles');
    if(Array.isArray(single)&&single.length)return single;
    var meta=LS.get('daf_pro_'+baseId+'_vehicles_meta');
    if(!meta||!meta.chunks)return [];
    var out=[];
    for(var i=0;i<meta.chunks;i++){
      var chunk=LS.get('daf_pro_'+baseId+'_vehicles_'+i);
      if(!Array.isArray(chunk))break;
      out=out.concat(chunk);
    }
    return out;
  }
  function _saveVehiclesChunked(baseId,d){
    _purgeVehicleChunks(baseId);
    if(!d||!d.length){
      LS.set('daf_pro_'+baseId+'_vehicles_meta',{count:0,chunks:0});
      return true;
    }
    var n=Math.ceil(d.length/VEH_CHUNK), i;
    for(i=0;i<n;i++){
      if(!LS.set('daf_pro_'+baseId+'_vehicles_'+i,d.slice(i*VEH_CHUNK,(i+1)*VEH_CHUNK)))return false;
    }
    return LS.set('daf_pro_'+baseId+'_vehicles_meta',{count:d.length,chunks:n});
  }
  function _setMemVehicles(base,d){
    _memVehicles=Array.isArray(d)?d:[];
    _memVehiclesBase=base;
  }
  return {
    initStorage(cb){
      var self=this, base=self.getBase();
      idbOpen().then(function(){
        return idbGet(_vehIdbKey(base));
      }).then(function(idbVeh){
        if(Array.isArray(idbVeh))_setMemVehicles(base,idbVeh);
        else _setMemVehicles(base,_loadVehiclesLegacy(base));
        if(typeof cb==='function')cb();
      }).catch(function(){
        _setMemVehicles(base,_loadVehiclesLegacy(base));
        if(typeof cb==='function')cb();
      });
    },
    getBase(){return localStorage.getItem('daf_pro_active')||'base1';},
    setBase(b){localStorage.setItem('daf_pro_active',b);_memVehicles=null;_memVehiclesBase=null;autoSave();},
    getBases(){return LS.get('daf_pro_bases')||{base1:'Base principale'};},
    saveBases(o){LS.set('daf_pro_bases',o);},
    key(k){return `daf_pro_${this.getBase()}_${k}`;},
    get(k){return LS.get(this.key(k));},
    set(k,v){const ok=LS.set(this.key(k),v); if(ok)updateSaveStatus(); return ok;},
    getClients(){return this.get('clients')||[];},
    getVehicles(){
      var base=this.getBase();
      if(_memVehicles!==null&&_memVehiclesBase===base)return _memVehicles;
      var legacy=this.get('vehicles');
      if(Array.isArray(legacy)){_setMemVehicles(base,legacy);return legacy;}
      var loaded=_loadVehiclesLegacy(base);
      _setMemVehicles(base,loaded);
      return loaded;
    },
    saveVehicles(d){
      var self=this, base=self.getBase(), arr=Array.isArray(d)?d:[];
      _setMemVehicles(base,arr);
      _purgeVehicleChunks(base);
      LS.del(self.key('vehicles'));
      return new Promise(function(resolve){
        function done(ok){if(ok)updateSaveStatus();resolve(!!ok);}
        if(_idb){
          idbSet(_vehIdbKey(base),arr).then(function(idbOk){
            if(idbOk)done(true);
            else done(_saveVehiclesChunked(base,arr));
          });
        }else{
          done(_saveVehiclesChunked(base,arr)||LS.set(self.key('vehicles'),arr));
        }
      });
    },
    copyVehiclesToBase(fromId,toId){
      var veh=_loadVehiclesLegacy(fromId);
      if(_memVehicles!==null&&_memVehiclesBase===fromId)veh=_memVehicles;
      return idbGet(_vehIdbKey(fromId)).then(function(idbV){
        var data=Array.isArray(idbV)&&idbV.length?idbV:veh;
        _purgeVehicleChunks(toId);
        LS.del('daf_pro_'+toId+'_vehicles');
        if(_idb&&data.length)return idbSet(_vehIdbKey(toId),data);
        if(data.length)return _saveVehiclesChunked(toId,data)?true:LS.set('daf_pro_'+toId+'_vehicles',data);
        return idbDel(_vehIdbKey(toId));
      });
    },
    purgeVehiclesForBase(baseId){
      _purgeVehicleChunks(baseId);
      LS.del('daf_pro_'+baseId+'_vehicles');
      if(_memVehiclesBase===baseId){_memVehicles=[];_memVehiclesBase=baseId;}
      return idbDel(_vehIdbKey(baseId));
    },
    getCRM(){return this.get('crm')||{};},
    getProjects(){return this.get('projects')||[];},
    getHistory(){return this.get('history')||{};},
    getPossession(){return this.get('possession')||{};},
    getSettings(){return this.get('settings')||{};},
    getExclusions(){return this.get('exclusions')||{};},
    saveExclusions(d){this.set('exclusions',d);},
    saveClients(d){return this.set('clients',d);},
    saveCRM(d){this.set('crm',d);},
    saveProjects(d){this.set('projects',d);},
    saveHistory(d){this.set('history',d);},
    savePossession(d){this.set('possession',d);},
    saveSettings(d){this.set('settings',d);},
    getLastSave(){return localStorage.getItem('daf_pro_lastsave');},
    touch(){localStorage.setItem('daf_pro_lastsave',new Date().toISOString()); updateSaveStatus();}
  };
})();

// ===== BACKUP SYSTEM =====
const BACKUP_FOLDER = 'DAF_COMMERCE-Box Backups';
const BACKUP_INTERVAL_MS = 30 * 60 * 1000; // 30 minutes
let _lastBackupData = null;
let _backupTimer = null;
let _unsavedChanges = false;

function autoSave(){
  DB.touch();
  _unsavedChanges = true;
  updateSaveStatus();
  scheduleAutoBackup();
}

function updateSaveStatus(){
  const dot=$('save-dot'), lbl=$('save-lbl');
  const navIcon=$('nav-save-icon'), navLbl=$('nav-save-lbl');
  const ls=DB.getLastSave();
  if(!ls){
    if(dot) dot.className='save-dot warn';
    if(lbl) lbl.textContent='Non sauvegardé';
    if(navIcon) navIcon.textContent='💾';
    if(navLbl) { navLbl.textContent='Backup'; navLbl.style.color='var(--text3)'; }
    return;
  }
  const d=new Date(ls);
  const timeStr=d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  if(dot) dot.className='save-dot ok';
  if(lbl) lbl.textContent='Sauvegardé '+timeStr;
  if(navIcon) navIcon.textContent=_unsavedChanges?'🔴':'💾';
  if(navLbl){
    navLbl.textContent=_unsavedChanges?'Non exporté':'Exporté';
    navLbl.style.color=_unsavedChanges?'var(--orange)':'var(--green)';
  }
}

function getBackupFilename(){
  const base=DB.getBases()[DB.getBase()]||'Base';
  const now=new Date();
  const d=now.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}).replace(/\//g,'-');
  const t=now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}).replace(':','h');
  return `DAF_Professional_${base.replace(/\s+/g,'_')}_${d}_${t}.json`;
}

function getBackupData(){
  if(typeof window.migrateCommerceStorage==='function')window.migrateCommerceStorage();
  const base=DB.getBase();
  var st=Object.assign({},DB.getSettings()||{});
  ['hotDeals','deliveries','archivedHotDeals','hotDealArchives','dealArchives'].forEach(function(k){delete st[k];});
  var archives=(typeof getArchivedHotDeals==='function'?getArchivedHotDeals():[])||[];
  return {
    version:8,
    app:'DAF_COMMERCE-Box',
    folder:BACKUP_FOLDER,
    base,
    nom:DB.getBases()[base],
    clients:DB.getClients(),
    vehicles:DB.getVehicles(),
    crm:DB.getCRM(),
    projects:DB.getProjects(),
    history:DB.getHistory(),
    possession:DB.getPossession(),
    settings:st,
    exclusions:DB.getExclusions(),
    hotDeals:(typeof getHotDeals==='function'?getHotDeals():[])||[],
    deliveries:(typeof getDeliveries==='function'?getDeliveries():[])||[],
    archivedHotDeals:archives,
    hotDealArchives:archives,
    exportDate:new Date().toISOString()
  };
}
function restoreCommerceFromBackup(data){
  if(!data)return;
  var st=data.settings||{};
  var hd=data.hotDeals||st.hotDeals||[];
  var del=data.deliveries||st.deliveries||[];
  var ar=data.archivedHotDeals||data.hotDealArchives||st.archivedHotDeals||st.hotDealArchives||st.dealArchives||[];
  if(typeof saveHotDeals==='function')saveHotDeals(hd);else DB.set('hotDeals',hd||[]);
  if(typeof saveDeliveries==='function')saveDeliveries(del);else DB.set('deliveries',del||[]);
  if(typeof saveArchivedHotDeals==='function')saveArchivedHotDeals(ar);else{DB.set('archivedHotDeals',ar||[]);DB.set('hotDealArchives',ar||[]);}
  if(typeof window.migrateCommerceStorage==='function')window.migrateCommerceStorage();
}

function triggerBackupDownload(silent){ if(silent===undefined)silent=false;
  const data=getBackupData();
  const json=JSON.stringify(data,null,2);
  const blob=new Blob([json],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=getBackupFilename();
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
  _unsavedChanges=false;
  _lastBackupData=json;
  DB.touch();
  updateSaveStatus();
  if(!silent) toast('💾 Backup téléchargé → '+BACKUP_FOLDER);
}

function scheduleAutoBackup(){
  clearTimeout(_backupTimer);
  _backupTimer=setTimeout(()=>{
    if(_unsavedChanges && DB.getClients().length>0){
      triggerBackupDownload(false);
      toast('⏱ Backup automatique → '+BACKUP_FOLDER,3500);
    }
  }, BACKUP_INTERVAL_MS);
}

function showBackupInstructions(){
  openModal('💾 Backup — '+BACKUP_FOLDER,`
    <div style="font-size:12px;color:var(--text2);line-height:1.6;">
      <div style="margin-bottom:10px;padding:8px;background:var(--daf-bg);border-radius:8px;border:1px solid var(--daf-border);">
        <strong style="color:var(--daf);">📁 Dossier cible :</strong><br>
        <span style="font-family:monospace;font-size:11px;">iCloud Drive / ${BACKUP_FOLDER}</span>
      </div>
      <p style="margin-bottom:8px;"><strong>Étape 1</strong> — Appuyez <strong>Télécharger maintenant</strong> ci-dessous</p>
      <p style="margin-bottom:8px;"><strong>Étape 2</strong> — Dans l'app <strong>Fichiers</strong> sur iPhone :</p>
      <p style="margin-bottom:4px;padding-left:12px;">• Ouvrez <strong>iCloud Drive</strong></p>
      <p style="margin-bottom:4px;padding-left:12px;">• Créez un dossier <strong>"${BACKUP_FOLDER}"</strong> si absent</p>
      <p style="margin-bottom:8px;padding-left:12px;">• Déplacez le fichier téléchargé dedans</p>
      <p style="margin-bottom:8px;"><strong>Étape 3</strong> — Pour restaurer :</p>
      <p style="margin-bottom:4px;padding-left:12px;">• Onglet <strong>⚙️ Plus</strong> → <strong>📥 Restaurer depuis JSON</strong></p>
      <p style="padding-left:12px;">• Sélectionnez le fichier depuis iCloud Drive</p>

// ===== COLUMN MAPPING =====
function findCol(headers, keys) {
  const hn = headers.map(h=>norm(h));
  // Passe 1 : correspondance exacte
  for(var _foi=0;_foi<keys.length;_foi++){
    const kn=norm(keys[_foi]);
    const idx=hn.findIndex(h=>h===kn);
    if(idx>=0)return idx;
  }
  // Passe 2 : l'en-tête contient la clé (pas l'inverse)
  for(var _foi2=0;_foi2<keys.length;_foi2++){
    const kn=norm(keys[_foi2]);
    if(kn.length<3)continue;
    const idx=hn.findIndex(h=>h.includes(kn));
    if(idx>=0)return idx;
  }
  return -1;
}

function _neededAliasesForImport(){
  return [
    'N° TVA','TVA','CLIENT/N° TVA','NTVA','NUM TVA','SIREN','SIRET','N° SIRET','N SIRET','NUM SIRET','NUMERO SIRET','SIRET ETABLISSEMENT','SIRET ENTREPRISE','SIRET CLIENT','CODE SIRET','VILLE','COMMUNE','CITY','CANTON','SECTEUR','ZONE','ACCESSIBLE','ACCESS','PROFIL_COMMERCIAL','PROFIL COMMERCIAL','PROFIL','PRIORITE_FORCEE','PRIORITE FORCEE','PRIORITE','EXCLU_MANU','EXCLU_MANUEL','EXCLU','VENDEUR','COMMERCIAL','NOM VENDEUR','NOM DU VENDEUR','PAYS','COUNTRY','DEPARTEMENT','DÉPARTEMENT','DEPT','CODE DEPARTEMENT','CODE DÉPARTEMENT','RUE','ADRESSE','ADRESSE CLIENT','ADRESSE SITE','ADRESSE ETABLISSEMENT','NOM','CLIENT','RAISON SOCIALE','RAISON_SOCIALE','ENTREPRISE','NAME','GROUPEMENT','ETAT PROSPECTION','ÉTAT PROSPECTION',
    'DATE D\'IMMATRICULATION','DATE IMMATRICULATION','DATE','DATE_IMMAT','PLAQUE D\'IMMATRICULATION','PLAQUE IMMATRICULATION','PLAQUE','TYPE CHASSIS','TYPE CHÂSSIS','TYPE VEHICULE','TYPE VÉHICULE','TYPE','MARQUE','BRAND','MAKE','CARROSSERIE','BODY','MODÈLE','MODELE','MODEL','NUMÉRO DE CHÂSSIS','NUMERO DE CHASSIS','NUM CHASSIS'
  ];
}
function _compactSheet(ws){
  var ref=ws['!ref']; if(!ref)return [[]];
  var range=XLSX.utils.decode_range(ref);
  var rawHeaders=[];
  for(var c=range.s.c;c<=range.e.c;c++){
    var cell=ws[XLSX.utils.encode_cell({r:range.s.r,c:c})];
    rawHeaders.push(cell?String(cell.v||'').trim():'');
  }
  var aliases=_neededAliasesForImport().map(function(x){return norm(x);});
  var keep=[];
  rawHeaders.forEach(function(h,i){
    if(!h)return;
    var nh=norm(h);
    if(aliases.some(function(a){return nh===a||nh.indexOf(a)>=0||a.indexOf(nh)>=0;})) keep.push(i);
  });
  if(!keep.length){keep=rawHeaders.map(function(_,i){return i;}).filter(function(i){return rawHeaders[i];});}
  var headers=keep.map(function(i){return rawHeaders[i];});
  var out=[headers];
  for(var r=range.s.r+1;r<=range.e.r;r++){
    var row=[], has=false;
    for(var k=0;k<keep.length;k++){
      var cell=ws[XLSX.utils.encode_cell({r:r,c:keep[k]})];
      var v=cell?cell.v:'';
      if(v!==''&&v!==null&&v!==undefined)has=true;
      row.push(v===undefined||v===null?'':v);
    }
    if(has)out.push(row);
    if(out.length%2500===0 && typeof console!=='undefined') console.log('Import compact',out.length,'lignes');
  }
  return out;
}
// ===== EXCEL PARSE optimisé iPhone =====
function parseExcel(file){
  return new Promise((resolve,reject)=>{
    if(typeof XLSX==='undefined'){reject(new Error('xlsx.full.min.js non chargé'));return;}
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const wb=XLSX.read(e.target.result,{type:'array',cellDates:false,dense:false,cellStyles:false,cellNF:false,cellHTML:false});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const data=_compactSheet(ws);
        resolve(data);
      }catch(err){reject(err);}
    };
    reader.onerror=reject;
    reader.readAsArrayBuffer(file);
  });
}

function importCRM(data){
  if(!data||data.length<2)return{clients:[],cols:[],stats:{}};
  const headers=data[0].map(h=>String(h||'').trim());
  const rows=data.slice(1).filter(r=>r.some(c=>c!==''));
  const raw=rows.map(r=>mapClientRow(r,headers)).filter(c=>c.tva);
  const seen=new Set(); const dups=[];
  const unique=raw.filter(c=>{
    if(seen.has(c.key)){dups.push(c.key);return false;}
    seen.add(c.key);return true;
  });
  const sansTva=raw.filter(c=>!c.tva).length;
  const sansNom=unique.filter(c=>!c.nom).length;
  const sansVille=unique.filter(c=>!c.ville).length;
  const sansCanton=unique.filter(c=>!c.canton).length;
  return{clients:unique,cols:headers.filter(Boolean),stats:{total:rows.length,reconnus:unique.length,sansTva,sansNom,sansVille,sansCanton,dups:dups.length}};
}

function importVehicles(data, possession){
  if(!data||data.length<2)return{vehicles:[],cols:[],stats:{}};
  const headers=data[0].map(h=>String(h||'').trim());
  const rows=data.slice(1).filter(r=>r.some(c=>c!==''));
  var siretByTva={};
  (DB.getClients()||[]).forEach(function(c){
    if(c.tva&&normSiret(c.siret)&&!siretByTva[c.tva])siretByTva[c.tva]=normSiret(c.siret);
  });
  var enrichedFromCrm=0;
  const raw=rows.map(function(r){
    var v=mapVehicleRow(r,headers);
    if(!normSiret(v.siret)&&v.tva&&siretByTva[v.tva]){v.siret=siretByTva[v.tva];enrichedFromCrm++;}
    return v;
  });
  const sansSiret=raw.filter(function(v){return !normSiret(v.siret);}).length;
  const withSiret=raw.filter(function(v){return normSiret(v.siret);});
  const seen=new Set(); const dups=[];
  const unique=withSiret.filter(v=>{
    const k=`${v.tva}|${v.plaque}|${norm(v.marque)}|${v.date}|${norm(v.type)}`;
    if(seen.has(k)){dups.push(k);return false;}
    seen.add(k);return true;
  });
  // Restore possession
  if(possession){
    unique.forEach(v=>{
      const vk=`${v.tva}|${v.plaque}`;
      if(possession[vk]===false)v.possession=false;
    });
  }
  const sansTva=raw.filter(v=>!v.tva).length;
  const sansDate=unique.filter(v=>!v.date).length;
  const sansPlaque=unique.filter(v=>!v.plaque).length;
  const sansType=unique.filter(v=>!v.type).length;
  const sansMarque=unique.filter(v=>!v.marque).length;
  return{vehicles:unique,cols:headers.filter(Boolean),stats:{total:rows.length,reconnus:unique.length,sansSiret,enrichedFromCrm,sansTva,sansDate,sansPlaque,sansType,sansMarque,dups:dups.length}};
}

// ===== INDEX BUILDING =====
let IDX = {vByTva:{}, vBySite:{}, vBySiret:{}, sitesByTva:{}, pByTva:{}, pBySite:{}, cByTva:{}, cByKey:{}, cBySite:{}, cBySiret:{}, cBySiren:{}};

// Memoization cache
var _statsCache = {};
var _filteredCache = null;
var _filteredCacheKey = '';
var _toursDataCache = null;
var _toursDataCacheKey = '';

function invalidateCache(){_statsCache={};_filteredCache=null;_filteredCacheKey='';_toursDataCache=null;_toursDataCacheKey='';}

function getStatsCached(tva,sk){
  var key=sk||tva;
  if(_statsCache[key])return _statsCache[key];
  const s=getStats(tva,sk);_statsCache[key]=s;return s;
}

function buildIndex(){
  invalidateCache();
  const clients=DB.getClients();
  const vehicles=DB.getVehicles();
  const projects=DB.getProjects();
  const possession=DB.getPossession();

  // === INDEX CLIENTS ===
  IDX.cBySiret={};
  IDX.cBySiren={};
  IDX.cByTva={};
  IDX.cByKey={};
  IDX.sitesByTva={};
  IDX.cBySite={};
  clients.forEach(function(c){
    var sk=makeSiteKey(c);
    c._siteKey=sk;
    IDX.cByKey[c.key]=c;
    // cByTva : dernier site pour cette TVA (utilisé pour lookups ponctuels)
    IDX.cByTva[c.tva]=c;
    if(c.siret){
      var ns=normSiret(c.siret);
      IDX.cBySiret[ns]=c;
      var siren=siretSiren(ns);
      if(siren){if(!IDX.cBySiren[siren])IDX.cBySiren[siren]=[];IDX.cBySiren[siren].push(c);}
    }
    if(!IDX.sitesByTva[c.tva])IDX.sitesByTva[c.tva]=[];
    IDX.sitesByTva[c.tva].push(c);
    IDX.cBySite[sk]=c;
  });

  // === INDEX VÉHICULES — UNIQUEMENT PAR SIRET ===
  // vBySite[sk] = véhicules du site exact (TVA+SIRET)
  // vByTva[tva] = union de tous les sites pour cette TVA (Marché uniquement)
  IDX.vBySiret={};
  IDX.vBySite={};
  IDX.vByTva={};
  vehicles.forEach(function(v){
    const vk=`${v.tva}|${v.plaque}`;
    if(possession[vk]===false)v.possession=false;
    else delete v.possession;
    var _vsiret=normSiret(v.siret);
    var clientS=resolveClientForVehicle(v);
    if(!clientS)return;
    if(!_vsiret)_vsiret=normSiret(clientS.siret);
    if(!_vsiret)return;
    // Index par SIRET brut
    if(!IDX.vBySiret[_vsiret])IDX.vBySiret[_vsiret]=[];
    IDX.vBySiret[_vsiret].push(v);
    // Index par site exact (TVA+SIRET) — source de vérité pour tous les calculs
    var sk=clientS._siteKey||makeSiteKey(clientS);
    if(!IDX.vBySite[sk])IDX.vBySite[sk]=[];
    IDX.vBySite[sk].push(v);
    // Index par TVA (union multi-sites) — pour Marché uniquement
    if(!IDX.vByTva[clientS.tva])IDX.vByTva[clientS.tva]=[];
    IDX.vByTva[clientS.tva].push(v);
  });

  // === INDEX PROJETS (TVA + site) ===
  IDX.pByTva={};
  IDX.pBySite={};
  projects.forEach(function(p){
    var tva=p.tva||'';
    if(tva){if(!IDX.pByTva[tva])IDX.pByTva[tva]=[];IDX.pByTva[tva].push(p);}
    var sk=resolveProjectSiteKey(p);
    if(sk){if(!IDX.pBySite[sk])IDX.pBySite[sk]=[];IDX.pBySite[sk].push(p);}
  });
  migrateLegacySiteData();
}
function migrateLegacySiteData(){
  var changed=false;
  function skForSingleTva(tva){
    var sites=(IDX.sitesByTva&&IDX.sitesByTva[tva])||[];
    if(sites.length!==1)return null;
    return sites[0]._siteKey||makeSiteKey(sites[0]);
  }
  var crm=DB.getCRM(), hist=DB.getHistory(), ex=DB.getExclusions();
  Object.keys(crm).forEach(function(k){
    if(k.indexOf('|')>=0)return;
    var sk=skForSingleTva(k);
    if(!sk||crm[sk])return;
    crm[sk]=crm[k];changed=true;
  });
  Object.keys(hist).forEach(function(k){
    if(k.indexOf('|')>=0)return;
    var sk=skForSingleTva(k);
    if(!sk||hist[sk])return;
    hist[sk]=hist[k];changed=true;
  });
  Object.keys(ex).forEach(function(k){
    if(k.indexOf('|')>=0)return;
    var sk=skForSingleTva(k);
    if(!sk||ex[sk])return;
    ex[sk]=ex[k];changed=true;
  });
  var projects=DB.getProjects();
  projects.forEach(function(p){
    if(p.siteKey||!p.tva)return;
    var sk=skForSingleTva(p.tva);
    if(sk){p.siteKey=sk;changed=true;}
  });
  if(changed){
    DB.saveCRM(crm);DB.saveHistory(hist);DB.saveExclusions(ex);DB.saveProjects(projects);
  }
}

// ===== BUSINESS LOGIC =====
// ===== DAF_COMMERCE-Box — normalisation marché unique =====
// Tous les calculs Marché doivent utiliser cette famille de marque.
// Objectif : KPI, graphiques, matrices et exports parlent le même langage.
function marketBrand(v){
  var raw = String((v && v.marque) || 'Inconnu').trim();
  var n = norm(raw).replace(/[\._\-\/]+/g,' ').replace(/\s+/g,' ').trim();
  if(!n)return 'Inconnu';
  if(n==='DAF' || n==='DAF TRUCKS' || n.indexOf('DAF')>=0)return 'DAF';
  if(n.indexOf('MERCEDES')>=0 || n.indexOf('BENZ')>=0)return 'MERCEDES';
  if(n.indexOf('RENAULT')>=0)return 'RENAULT';
  if(n.indexOf('VOLVO')>=0)return 'VOLVO';
  if(n.indexOf('SCANIA')>=0)return 'SCANIA';
  if(n==='MAN' || n.indexOf(' MAN ')>=0 || n.indexOf('MAN TRUCK')>=0)return 'MAN';
  if(n.indexOf('IVECO')>=0)return 'IVECO';
  if(n.indexOf('FORD')>=0)return 'FORD';
  return raw.toUpperCase();
}
function marketYearKey(v){
  var y=getYear(v&&v.date);
  return y || 'Date ?';
}
function marketYearSort(a,b){
  if(a==='Date ?')return 1;
  if(b==='Date ?')return -1;
  return Number(a)-Number(b);
}
function isDaf(v){
  return marketBrand(v)==='DAF';
}
function vehicleTypeCategory(v){
  var txt=norm(((v&&v.type)||'')+' '+((v&&v.carrosserie)||''));
  if(/TRACT|SEMI|CABINE|TETE|TÊTE/.test(txt))return 'tracteur';
  if(/PORTEUR|FOURGON|BENNE|FRIGO|PLATEAU|CITERNE|AMPLIROLL|BRAS|REMORQUEUR/.test(txt))return 'porteur';
  return 'verifier';
}
function isTracteur(v){return vehicleTypeCategory(v)==='tracteur';}
function isPorteur(v){return vehicleTypeCategory(v)==='porteur';}
function isTypeVerifier(v){return vehicleTypeCategory(v)==='verifier';}
function profilNorm(c){
  return norm((c&&c.profil)||'')
    .replace(/[\._\-\/]+/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}
function hasWord(txt, words){
  txt=' '+norm(txt).replace(/[\._\-\/]+/g,' ').replace(/\s+/g,' ').trim()+' ';
  return words.some(function(w){return txt.indexOf(' '+norm(w)+' ')>=0;});
}
function isFlotteProfile(c){
  var p=profilNorm(c);
  // Détection volontairement robuste : certains fichiers importés indiquent
  // seulement "REGIONALE", "COORDONNEE" ou "NATIONALE" sans le mot FLOTTE.
  return /(^| )FLOTTES?( |$)/.test(p)

function makeSiteKey(o){
  var t=String((o&&o.tva)||'').trim();
  var s=String((o&&o.siret)||'').trim();
  if(!t)return '';
  if(s)return t+'|'+s;
  // Pas de SIRET : on conserve une clé technique pour affichage, mais QUALITÉ le signalera.
  return t+'|SIRET_MANQUANT|'+norm((o&&o.ville)||'')+'|'+norm((o&&o.nom)||o.client||'');
}
function resolveProjectSiteKey(p){
  if(!p)return '';
  var sk=String(p.siteKey||'').trim();
  var tva=String(p.tva||'').trim();
  if(sk&&IDX.cBySite&&IDX.cBySite[sk])return sk;
  if(sk&&sk.indexOf('|')>=0)return sk;
  if(tva){
    var sites=(IDX.sitesByTva&&IDX.sitesByTva[tva])||[];
    if(sk){
      var byTva=sites.find(function(c){return String(c.tva||'')===sk;});
      if(byTva)return byTva._siteKey||makeSiteKey(byTva);
    }
    if(sites.length===1)return sites[0]._siteKey||makeSiteKey(sites[0]);
    if(!sk){
      var pc=IDX.cByTva&&IDX.cByTva[tva];
      if(pc)return pc._siteKey||makeSiteKey(pc);
    }
  }
  return sk;
}

let _modalExportGetter=null;
function _csvEscapeCell(v){v=String(v==null?'':v);return '"'+v.replace(/"/g,'""')+'"';}
function _sanitizeExportFilename(title){
  return String(title||'export').replace(/[^\w\s\-àâäéèêëïîôùûüçÀÂÄÉÈÊËÏÎÔÙÛÜÇ]/g,'').replace(/\s+/g,'_').slice(0,80)||'export';
}
function _extractRowsFromTable(table){
  var rows=[];
  if(!table)return rows;
  table.querySelectorAll('tr').forEach(function(tr){
    var cells=tr.querySelectorAll('th,td');
    if(!cells.length)return;
    rows.push(Array.from(cells).map(function(c){
      var n=c.cloneNode(true);
      n.querySelectorAll('button,input,select,textarea').forEach(function(el){el.remove();});
      return (n.textContent||'').trim().replace(/\s+/g,' ');
    }));
  });
  return rows;
}
function _modalBodyToExportRows(body){
  body=body||$('modal-body');
  if(!body)return null;
  var view=body.querySelector('#kpi-modal-view')||body;
  var tables=view.querySelectorAll('table');
  if(tables.length){
    var all=[];
    tables.forEach(function(t,idx){
      if(idx>0&&all.length)all.push([]);
      all=all.concat(_extractRowsFromTable(t));
    });
    if(all.length)return all;
  }
  var items=view.querySelectorAll('.base-item, .diag-row, .rank-row, .q-item');
  if(items.length){
    var rows=[['Libellé','Détail']];
    items.forEach(function(it){
      var titleEl=it.querySelector('strong,.rank-info div,.q-title-line strong');
      var title=titleEl?(titleEl.textContent||'').trim():'';
      var detail=(it.textContent||'').trim().replace(/\s+/g,' ').replace(/Ouvrir|Fiche|Modifier|Masquer|Voir/g,'').trim();
      if(!title)title=detail.split(' · ')[0]||detail;
      rows.push([title,detail]);
    });
    if(rows.length>1)return rows;
  }
  return null;
}
function exportRowsToExcel(filename,rows){
  if(!rows||!rows.length){toast('Rien à exporter');return;}
  var base=_sanitizeExportFilename(filename);
  if(typeof XLSX!=='undefined'){
    var wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'Export');
    XLSX.writeFile(wb,base+'.xlsx');
  }else{
    var csv='\ufeff'+rows.map(function(r){return r.map(_csvEscapeCell).join(';');}).join('\n');
    var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=base+'.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
  }
  toast('📊 Export Excel téléchargé');
}
function _modalHasExportableContent(){
  var body=$('modal-body');

}
function getMarcheKpiVehiclesList(kind,filtVeh){
  filtVeh=filtVeh||DB.getVehicles().filter(matchesMarcheVehicle);

    +'<div class="gf-btn'+(GF.marcheTypeFilter==='tous'?' gf-on':'')+'" id="btn-filter-tous" style="cursor:pointer;font-size:9px;">Tous types</div>'

function _bindMarcheDeferredInteractions(filtVeh){
  function mkCarroDetail(carroName,prefix){
    var src=prefix==='daf'?filtVeh.filter(isDaf):filtVeh;
    var matched=src.filter(function(v){return norm(v.carrosserie||'')===norm(carroName);}).sort(function(a,b){return(b.date||'').localeCompare(a.date||'');});
    var detId=prefix==='daf'?'carro-daf-detail':'carro-all-detail';
    var det=$(detId);if(!det||!matched.length){if(det)det.innerHTML='';return;}
    var allClients=DB.getClients();var rows='';
    for(var mi=0;mi<Math.min(matched.length,50);mi++){
      var mv=matched[mi];var mc=allClients.find(function(cl){return cl.tva===mv.tva;})||{nom:mv.client||mv.tva};

function renderMktBars(vehicles){
  const counts={};
  vehicles.forEach(v=>{const m=(v.marque||'Inconnu').trim();counts[m]=(counts[m]||0)+1;});
  const total=Object.values(counts).reduce((a,b)=>a+b,0)||1;
  const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,10);
  return sorted.map(([brand,count])=>{
    const pct=Math.round(count/total*100);
    const col=(function(){for(var _bce=0;_bce<Object.keys(BRAND_COLORS).length;_bce++){var _bck=Object.keys(BRAND_COLORS)[_bce];if(brand.toUpperCase().includes(_bck))return BRAND_COLORS[_bck];}return 'var(--text3)';})();
    return`<div class="mkt-row">
      <div class="mkt-brand"><span class="mkt-name">${escH(brand)}</span><span class="mkt-count">${count} — ${pct}%</span></div>
      <div class="mkt-bar-wrap"><div class="mkt-bar" style="width:${pct}%;background:${col};"></div></div>
    </div>`;
  }).join('')||'<div style="font-size:11px;color:var(--text3);">Aucun véhicule</div>';
}

function dafForceAppUpdate(cb){
  var done=function(){
    try{localStorage.setItem('daf_app_build',APP_BUILD);}catch(e){}
    if(typeof cb==='function')cb();
  };
  var p=Promise.resolve();
  if('serviceWorker' in navigator){
    p=p.then(function(){return navigator.serviceWorker.getRegistrations();}).then(function(regs){
      return Promise.all((regs||[]).map(function(r){return r.unregister();}));
    });
  }
  if('caches' in window){
    p=p.then(function(){return caches.keys();}).then(function(keys){
      return Promise.all((keys||[]).map(function(k){return caches.delete(k);}));
    });
  }
  p.then(done).catch(done);
}
function dafForceAppUpdateIfNeeded(){
  try{
    var urlV=(location.search.match(/[?&]v=([^&]+)/)||[])[1]||'';
    var stored=localStorage.getItem('daf_app_build')||'';
    if(urlV===APP_BUILD&&stored===APP_BUILD)return false;
    if(sessionStorage.getItem('daf_reload_'+APP_BUILD)==='1'&&urlV===APP_BUILD){
      localStorage.setItem('daf_app_build',APP_BUILD);
      return false;
    }
    sessionStorage.setItem('daf_reload_'+APP_BUILD,'1');
    dafForceAppUpdate(function(){
      var q='?v='+encodeURIComponent(APP_BUILD);
      if((location.search||'').indexOf('reset=1')>=0)q+='&reset=1';
      location.replace(location.pathname+q+location.hash);
    });
    return true;
  }catch(e){return false;}
}

function getBrandLogo(marque) {
  const m = (marque||'').trim().toUpperCase();
  if(!m) return '<span class="brand-logo"><svg width="20" height="20" viewBox="0 0 20 20" aria-label="?"><rect width="20" height="20" rx="3" fill="#2a3040"/><text x="10" y="14" text-anchor="middle" font-size="10" font-weight="700" fill="#a0a8b8">?</text></svg></span>';
  var keys=Object.keys(BRAND_LOGOS).sort(function(a,b){return b.length-a.length;});
  for(var i=0;i<keys.length;i++){
    var k=keys[i];
    if(m===k||m.indexOf(k)>=0) return BRAND_LOGOS[k];
  }
  const initial = m.charAt(0);
  return '<span class="brand-logo"><svg width="20" height="20" viewBox="0 0 20 20" aria-label="'+escH(m)+'"><rect width="20" height="20" rx="3" fill="#2a3040"/><text x="10" y="14" text-anchor="middle" font-size="10" font-weight="700" fill="#a0a8b8">'+escH(initial)+'</text></svg></span>';
}

function wfProjetDetecte(tva,nom,sk){
  openModal(`✅ Projet — ${nom}`,`
    <div class="form-group">
      <label class="form-label">Type de projet</label>
      <div style="display:flex;gap:6px;">
        <button class="btn btn-blue" id="wf-ec" style="flex:1;">EN COURS</button>
        <button class="btn btn-secondary" id="wf-fut" style="flex:1;">FUTUR</button>
      </div>
    </div>
    <div id="wf-form"></div>
  `,[{label:'Fermer',cls:'btn-ghost'}]);

  const buildWfForm=(type)=>{
    $('wf-form').innerHTML=`
      <div class="form-group"><label class="form-label">Nombre de camions</label><input type="number" class="form-input" id="wf-cam" min="1" value="1"></div>
      ${type==='FUTUR'?`<div class="form-group"><label class="form-label">Date projet</label><input type="date" class="form-input" id="wf-date" value="${YEAR+1}-01-01"></div>`:''}
      <div class="form-group"><label class="form-label">Commentaire</label><textarea class="form-input form-textarea" id="wf-cmt" placeholder="Notes…" style="min-height:55px;"></textarea></div>
      <button class="btn btn-green" id="wf-save" style="width:100%;margin-top:3px;">💾 Enregistrer</button>
    `;
    $('wf-save').onclick=()=>{
      const camions=parseInt(($('wf-cam')||{}).value)||1;
      const date=type==='FUTUR'?(($('wf-date')||{}).value||''):new Date().toISOString().split('T')[0];
      const commentaire=($('wf-cmt')||{}).value||'';
      const projects=DB.getProjects();
      const id='p'+Date.now();
      projects.push({id,tva,nom,siteKey:sk||'',status:type,camions,date,commentaire,created:new Date().toISOString()});
      DB.saveProjects(projects);
      var c=sk?(IDX.cBySite&&IDX.cBySite[sk]):null;
      appendHistoryEntry(c||{tva:tva},{date:new Date().toISOString(),type:`PROJET ${type}`,text:`${camions} camion(s) · ${commentaire}`},sk);
      // Sync to hotDeals
      try{
        var hd=window.getHotDeals?window.getHotDeals():[];
        if(!hd.some(function(d){return d.projectId===id;})){
          hd.push({id:'deal_'+Date.now(),projectId:id,tva:tva,siteKey:sk||'',client:nom,created:date||new Date().toISOString().slice(0,10),status:type,comment:commentaire,lines:[{id:'line_'+Date.now(),type:'Tracteur',model:'',qty:camions,wonQty:0,lostQty:0,concurrent:'',lossComment:'',orderDate:'',deliveryDate:'',productionNo:'',maintenance:'Non',paccar:'Non',marginPct:'',prime:0,result:'',vnvo:'VN'}]});
          if(window.saveHotDeals)window.saveHotDeals(hd);
        }
        // Log activity
        _logActivity({type:'PROJET_CREATE',status:type,clientNom:nom,tva:tva,description:'Projet '+type+' créé · '+camions+' camion(s)'+(commentaire?' · '+commentaire:'')});
      }catch(e){}
      buildIndex();
      autoSave();
      toast(`Projet ${type} enregistré`);
      closeModal();
      if(sk)openSiteSheet(sk);else openClientSheet(tva);
      if(currentScreen==='projets')renderProjets();
      if(currentScreen==='tours')renderTours();
    };
  };

  safeOn('wf-ec','click',()=>buildWfForm('EN_COURS'));
  safeOn('wf-fut','click',()=>buildWfForm('FUTUR'));
}

function openProjectActions(pid,tva){
  const projects=DB.getProjects();
  const p=projects.find(x=>x.id===pid);
  if(!p)return;
  openModal('Actions projet',`
    <div style="font-size:12px;color:var(--text2);margin-bottom:10px;">
      <strong>${escH(p.nom||tva)}</strong><br>
      Statut : <strong>${p.status}</strong> · ${p.camions} camion(s)<br>
      ${p.commentaire?'<em>'+escH(p.commentaire)+'</em>':''}
    </div>
  `,[
    {label:'✅ GAGNÉ',cls:'btn-green',action:()=>updateProjet(pid,'GAGNE',tva)},
    {label:'❌ PERDU',cls:'btn-red',action:()=>updateProjet(pid,'PERDU',tva)},
    {label:'🔄 REPORTÉ → FUTUR',cls:'btn-orange',action:()=>reporterProjet(pid,tva)},
    {label:'🗑 SUPPRIMER',cls:'btn-red',action:()=>{closeModal();setTimeout(()=>deleteProjet(pid,tva),100);},close:true},
    {label:'Annuler',cls:'btn-ghost',close:true},
  ]);
}

function updateProjet(pid,status,tva){
  const projects=DB.getProjects();
  const idx=projects.findIndex(p=>p.id===pid);
  if(idx<0)return;
  var p=projects[idx];
  projects[idx].status=status;
  projects[idx].updated=new Date().toISOString();
  DB.saveProjects(projects);
  var sk=p.siteKey||'';
  if(!sk&&tva){var c=IDX.cByTva&&IDX.cByTva[tva];if(c)sk=c._siteKey||makeSiteKey(c);}
  appendHistoryEntry(p||{tva:tva},{date:new Date().toISOString(),type:`PROJET → ${status}`,text:''},sk);
  buildIndex();
  autoSave();
  toast(`Projet → ${status}`);
  if(sk)openSiteSheet(sk);else openClientSheet(tva);
  if(currentScreen==='projets')renderProjets();
  if(currentScreen==='tours')renderTours();
}

function reporterProjet(pid,tva){
  openModal('🔄 Reporter le projet',`
    <div class="form-group"><label class="form-label">Nouvelle date</label><input type="date" class="form-input" id="rep-date" value="${YEAR+1}-01-01"></div>
    <div class="form-group"><label class="form-label">Commentaire</label><textarea class="form-input form-textarea" id="rep-cmt" placeholder="Raison du report…" style="min-height:50px;"></textarea></div>
  `,[
    {label:'Annuler',cls:'btn-ghost'},
    {label:'Reporter',cls:'btn-orange',action:()=>{
      const projects=DB.getProjects();
      const idx=projects.findIndex(p=>p.id===pid);
      if(idx<0)return;
      const newDate=($('rep-date')||{}).value||'';
      const cmt=($('rep-cmt')||{}).value||'';
      var p=projects[idx];
      projects[idx].status='FUTUR';
      projects[idx].date=newDate;
      projects[idx].commentaire=cmt?`[Reporté] ${cmt}`:('[Reporté] '+(projects[idx].commentaire||''));
      projects[idx].updated=new Date().toISOString();
      DB.saveProjects(projects);
      var sk=p.siteKey||'';
      if(!sk&&tva){var c=IDX.cByTva&&IDX.cByTva[tva];if(c)sk=c._siteKey||makeSiteKey(c);}
      appendHistoryEntry(p||{tva:tva},{date:new Date().toISOString(),type:'PROJET REPORTÉ',text:`Nouvelle date : ${fmtDate(newDate)} · ${cmt}`},sk);
      buildIndex();
      autoSave();
      toast('Projet reporté');
      if(sk)openSiteSheet(sk);else openClientSheet(tva);
      if(currentScreen==='projets')renderProjets();
    }}
  ]);
}

function deleteProjet(pid,tva,sk){
  openModal('🗑 Supprimer ce projet',`<p style="font-size:12px;color:var(--text2);">Supprimer définitivement ce projet, l'affaire liée et les commissions associées ? Cette action est irréversible.</p>`,[
    {label:'Annuler',cls:'btn-ghost',close:true},
    {label:'🗑 Supprimer définitivement',cls:'btn-red',close:true,action:()=>{
      if(typeof window.deleteProjectBundle==='function'){
        window.deleteProjectBundle(pid,{tva:tva,sk:sk,skipConfirm:true});
        return;
      }
      const projects=DB.getProjects().filter(p=>p.id!==pid);
      DB.saveProjects(projects);
      buildIndex();
      autoSave();
      toast('Projet supprimé');
      setTimeout(()=>{openClientSheet(tva);},100);
      if(currentScreen==='projets')setTimeout(renderProjets,150);
      if(currentScreen==='tours')setTimeout(renderTours,150);
    }}
  ]);
}

// ===== PROJETS SCREEN =====
let projetFilter='all', projetSearch='', projetSort='date_desc';

function renderProjets(){
  const projects=DB.getProjects();
  const clients=DB.getClients();
  const open=projects.filter(p=>p.status==='EN_COURS'||p.status==='FUTUR');
  const yearP=projects.filter(p=>getYear(p.date)===YEAR);
  const gagnes=projects.filter(p=>p.status==='GAGNE');
  const perdusList=projects.filter(p=>p.status==='PERDU');
  const totalCam=open.reduce((a,p)=>a+(parseInt(p.camions)||0),0);
  const camionsGagnesAnnee=projects.filter(p=>p.status==='GAGNE'&&getYear(p.updated||p.created||p.date)===YEAR).reduce((a,p)=>a+(parseInt(p.camions)||0),0);

  // Apply filter + search
  let shown=projects;
  if(projetFilter==='open') shown=shown.filter(p=>p.status==='EN_COURS'||p.status==='FUTUR');
  else if(projetFilter==='year') shown=shown.filter(p=>getYear(p.date)===YEAR);
  else if(projetFilter==='gagne') shown=shown.filter(p=>p.status==='GAGNE');
  else if(projetFilter==='perdu') shown=shown.filter(p=>p.status==='PERDU');

  if(projetSearch.trim()){
    const q=projetSearch.toLowerCase();
    shown=shown.filter(p=>(p.nom||'').toLowerCase().includes(q)||(p.tva||'').includes(q)||(p.commentaire||'').toLowerCase().includes(q));
  }

  // Sort
  if(projetSort==='date_desc') shown=shown.slice().sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));
  else if(projetSort==='date_asc') shown=shown.slice().sort((a,b)=>new Date(a.date||0)-new Date(b.date||0));
  else if(projetSort==='nom_asc') shown=shown.slice().sort((a,b)=>(a.nom||'').localeCompare(b.nom||''));
  else if(projetSort==='nom_desc') shown=shown.slice().sort((a,b)=>(b.nom||'').localeCompare(a.nom||''));
  else if(projetSort==='created_desc') shown=shown.slice().sort((a,b)=>new Date(b.created||0)-new Date(a.created||0));

function dlCSV(filename,rows){
  const csv=rows.map(r=>r.map(c=>`"${String(c||'').replace(/"/g,'""')}"`).join(';')).join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=filename;a.click();
}

function exportCSV(type){
  const base=DB.getBases()[DB.getBase()]||'base';
  const clients=DB.getClients();const vehicles=DB.getVehicles();
  const filtered=applyGlobalFilters(clients);

  if(type==='tours'){
    const rows=[['TVA','Client','Ville','Canton','Vendeur','Pays','Dept','SIREN','SIRET','Flotte','Urgente','Projet','Parc','DAF','R.DAF','R.Hors','Score']];
    filtered.forEach(c=>{
      const s=getStats(c.tva);
      const isF=/flotte r[eé]gionale|flotte coordonn[eé]e/i.test(c.profil||'')?'OUI':'NON';
      const isU=(c.priorite&&c.priorite.trim())?'OUI':'NON';
      const isP=hasOpenProject(c.tva)?'OUI':'NON';
      rows.push([c.tva,c.nom,c.ville,c.canton,c.vendeur,c.pays,c.dept,c.siren,c.siret,isF,isU,isP,s.parc,s.dafCount,s.dafRenew,s.horsRenew,s.score]);
    });
    dlCSV(`${base}_tournees_${YEAR}.csv`,rows);
    toast('Export Tournées téléchargé');
  }else if(type==='renewals'){
    const rows=[['TVA','Client','Ville','Canton','Vendeur','Pays','Dept','SIRET','Plaque','Marque','Modèle','Type','Carrosserie','Date Immat','Année','R.DAF/Hors','Possession']];
    filtered.forEach(c=>{
      _getSiteVeh(c.tva,c._siteKey||makeSiteKey(c)).filter(v=>isRenewDaf(v)||isRenewHors(v)).forEach(v=>{
        const possession=(DB.getPossession()[`${v.tva}|${v.plaque}`]===false)?'NON':'OUI';
        rows.push([c.tva,c.nom,c.ville,c.canton,c.vendeur||v.vendeur,c.pays||v.pays,c.dept||v.dept,c.siret||v.siret,v.plaque,v.marque,v.modele,v.type,v.carrosserie,fmtDate(v.date),getYear(v.date),isRenewDaf(v)?'DAF':'HORS DAF',possession]);
      });
    });
    dlCSV(`${base}_renouvellements_${YEAR}.csv`,rows);
    toast('Export Renouvellements téléchargé');
  }else if(type==='projects'){
    const rows=[['ID','TVA','Client','Ville','Canton','Vendeur','Pays','Dept','SIRET','Statut','Date','Camions','Commentaire','Résultat','Créé','MàJ']];
    DB.getProjects().forEach(p=>{
      const c=IDX.cByTva[p.tva]||{};
      rows.push([p.id,p.tva,p.nom,c.ville,c.canton,c.vendeur,c.pays,c.dept,c.siret,p.status,p.date,p.camions,p.commentaire,p.result||'',p.created,p.updated||'']);
    });
    dlCSV(`${base}_projets_${YEAR}.csv`,rows);
    toast('Export Projets téléchargé');
  }else if(type==='crm'){
    const rows=[['TVA','Client','Ville','Canton','Date action','Type','Commentaire']];
    filtered.forEach(c=>{
      var sk=c._siteKey||makeSiteKey(c);
      getHistoryEntries(c,sk).forEach(h=>{
        rows.push([c.tva,c.nom,c.ville,c.canton,fmtDate(h.date),h.type,h.text]);
      });
    });
    dlCSV(`${base}_crm_${YEAR}.csv`,rows);
    toast('Export CRM téléchargé');
  }
}

function restoreJSON(file){
  return new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const data=JSON.parse(e.target.result);
        openModal('📥 Restaurer',`<p style="font-size:12px;color:var(--text2);">Restaurer la base <strong>${escH(data.nom||data.base||'?')}</strong> avec ${(data.clients||[]).length} clients et ${(data.vehicles||[]).length} véhicules ?<br><br>⚠️ Les données actuelles seront remplacées.</p>`,[
          {label:'Annuler',cls:'btn-ghost'},
          {label:'Restaurer',cls:'btn-primary',action:()=>{
            if(data.clients)DB.saveClients(data.clients);
            if(data.crm)DB.saveCRM(data.crm);
            if(data.projects)DB.saveProjects(data.projects);
            if(data.history)DB.saveHistory(data.history);
            if(data.possession)DB.savePossession(data.possession);
            var p=data.vehicles?DB.saveVehicles(data.vehicles):Promise.resolve(true);
            p.then(function(){
              buildIndex();autoSave();
              toast('Restauration effectuée !');
              renderMarche();renderMore();
              resolve(true);
            });
          }}
        ]);
      }catch(err){toast('Fichier JSON invalide');resolve(false);}
    };
    reader.readAsText(file);
  });
}

function getAppSettings(){return DB.getSettings()||{};}
function saveAppSettings(st){DB.saveSettings(st||{});autoSave();}
function getManualGroups(){var st=getAppSettings();return st.manualGroups||[];}
function saveManualGroups(groups){var st=getAppSettings();st.manualGroups=groups||[];saveAppSettings(st);}
function groupIdForTva(tva){return 'AUTO_TVA_'+String(tva||'').replace(/[^A-Za-z0-9]/g,'_');}
function makeManualGroupId(){return 'GRP_'+Date.now()+'_'+Math.floor(Math.random()*1000);}
function siteInManualGroup(sk){var groups=getManualGroups();for(var i=0;i<groups.length;i++){if((groups[i].siteKeys||[]).indexOf(sk)>=0)return groups[i];}return null;}

function _siteKeyList(group){return (group&&group.siteKeys||[]).filter(function(sk){return IDX.cBySite&&IDX.cBySite[sk];});}
function _groupPrincipalKey(gid){
  var group=getGroupById(gid); if(!group)return '';
  var keys=_siteKeyList(group); if(!keys.length)return '';

  for(var i=0;i<keys.length;i++){
    var m=meta[gid+'|'+keys[i]]||{};
    if(m.principal===true)return keys[i];
  }
  if(group.auto){
    var siegeSk=getVerifiedSiegeSiteKeyForGroup(group);
    if(siegeSk&&keys.indexOf(siegeSk)>=0)return siegeSk;
  }
  return keys[0];
}
function getGroupDisplayName(group){

}
function groupSiteIsPrincipal(gid,sk){return _groupPrincipalKey(gid)===sk;}
function groupSiteIsDecisionnaire(gid,sk){

function passesToursExclusions(c){

  var greens=[],oranges=[];
  TOURS_MASK_DEFS.forEach(function(d){

  });
  if(greens.length){
    for(var gi=0;gi<greens.length;gi++){if(!toursMaskRowMatch(c,greens[gi]))return false;}
  }
  for(var oi=0;oi<oranges.length;oi++){if(toursMaskRowMatch(c,oranges[oi]))return false;}

function _toursMaskLabel(st){return st==='exclude'?'OFF':(st==='only'?'ON':'');}
function _formatToursMaskStates(){

function toursMaskExcludeReasons(row){
  ensureToursMaskTriState();

    var st=GF[d.key]||'neutral';
    if(st==='only')greens.push(d);
    else if(st==='exclude')oranges.push(d);
  });
  if(greens.length){
    for(var gi=0;gi<greens.length;gi++){
      if(!toursMaskRowMatch(row,greens[gi].id))reasons.push('hors cible '+greens[gi].label+' ON');

  for(var oi=0;oi<oranges.length;oi++){

function findSiteKeyMatchingSiege(tva,data){

function normAddrCompare(s){return String(s||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9]/g,' ').replace(/\s+/g,' ').trim();}
function compareAddresses(local,official){
  if(!local||!official)return null;
  var a=normAddrCompare(local),b=normAddrCompare(official);
  if(!a||!b)return null;
  if(a===b)return true;
  var cpa=(String(local).match(/\b(\d{5})\b/)||[])[1],cpb=(String(official).match(/\b(\d{5})\b/)||[])[1];

    var words=a.split(' ').filter(function(w){return w.length>3;});
    var hits=words.filter(function(w){return b.indexOf(w)>=0;});
    return hits.length>=Math.min(2,Math.max(1,words.length));
  }
  return false;
}

function fetchCompanyFromRegistry(c){

  var html='<div class="card quality-section" id="qualite-parc-diff-marche-tours">';

  if(!diff.length){
    html+='<div style="padding:8px 0;font-size:11px;color:var(--green);">Aucun écart — parcs identiques avec les filtres actuels.</div>';
  }else{
    html+='<div style="max-height:55vh;overflow:auto;border:1px solid var(--border);border-radius:8px;background:var(--bg3);">';
    html+='<table style="width:100%;border-collapse:collapse;font-size:10px;min-width:520px;">';
    html+='<thead><tr style="background:var(--bg2);color:var(--text3);text-align:left;"><th style="padding:7px 8px;">Plaque</th><th style="padding:7px 8px;">SIRET</th><th style="padding:7px 8px;">Client</th><th style="padding:7px 8px;">Date immat.</th><th style="padding:7px 8px;text-align:right;">Fiche</th></tr></thead><tbody>';

      var sk=c?(c._siteKey||makeSiteKey(c)):_siteKeyFromVehicle(v);

    });
    html+='</tbody></table></div>';
  }
  html+='</div></div>';
  return html;
}

function _qualityVehicleItem(v){
