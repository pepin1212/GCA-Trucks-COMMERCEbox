   4) Date future mise en évidence dans l'encart pense-bête / affaire.
*/
(function(){
  'use strict';
  window.DAF_COMMERCEBOX_BUILD='FOUNDATION-B002N-AFFAIRES-DATES-REMINDER-FIX';
  function byId(id){return document.getElementById(id)}
  function all(sel,root){try{return Array.prototype.slice.call((root||document).querySelectorAll(sel))}catch(e){return []}}
  function text(el){return ((el&&el.textContent)||'').replace(/\s+/g,' ').trim()}
  function lower(el){return text(el).toLowerCase()}

  function removeDuplicateReminder(){
    try{
      // On garde uniquement le pense-bête principal final : #cb-reminders-hard.
      all('#cb-future-reminders,#cb-reminders').forEach(function(el){try{el.remove()}catch(e){el.style.display='none'}})
      var hard=all('#cb-reminders-hard');
      if(hard.length>1){hard.slice(1).forEach(function(el){try{el.remove()}catch(e){el.style.display='none'}})}
      // Si un ancien encart sans id contient le titre À relancer / Pense-bête, on le supprime sauf cb-reminders-hard.
      all('#affaires-content .card').forEach(function(card){
        if(card.id==='cb-reminders-hard')return;
        var t=lower(card);
        if(t.indexOf('à relancer')>=0 && t.indexOf('projets futurs')>=0){try{card.remove()}catch(e){card.style.display='none'}}
        if(t.indexOf('pense-bête')>=0 && t.indexOf('projets futurs')>=0){try{card.remove()}catch(e){card.style.display='none'}}
      });
    }catch(e){console.warn('removeDuplicateReminder',e)}
  }

  function highlightFutureDates(){
    try{
      var root=byId('cb-reminders-hard'); if(!root)return;
      // Chaque ligne du pense-bête a un bloc gauche ; sa deuxième ligne contient la date future.
      all(':scope > div',root).forEach(function(row){
        if(row.classList && row.classList.contains('card-title'))return;
        var left=row.querySelector('div[style*="flex:1"]')||row.firstElementChild;
        if(!left)return;
        var parts=all(':scope > div',left);
        if(parts.length>=2){
          var dateLine=parts[1];
          dateLine.style.color='var(--daf)';
          dateLine.style.fontWeight='900';
          dateLine.style.fontSize='11px';
          dateLine.style.letterSpacing='.2px';
          if(dateLine.textContent && dateLine.textContent.indexOf('📅')<0){dateLine.textContent='📅 '+dateLine.textContent.trim()}
        }
      });
    }catch(e){console.warn('highlightFutureDates',e)}
  }

  function removeLegacyDateFilters(){
    try{
      var root=byId('affaires-content'); if(!root)return;
      all('#cb-affaires-datefilters,#cb-aff-datefilters,#cb-affaires-datefilters-hard',root).forEach(function(el){try{el.remove()}catch(e){el.style.display='none'}});
      all('.card,.filter-row,div',root).forEach(function(el){
        var t=lower(el);
        var isDateFilter=(t.indexOf('filtres affaires')>=0||t.indexOf('filtre affaires')>=0)&&t.indexOf('date')>=0;
        if(isDateFilter){try{el.remove()}catch(e){el.style.display='none'}}
      });
      qsa('#affaires-content [data-deal-id]').forEach(function(card){card.style.display='';});
    }catch(e){console.warn('removeLegacyDateFilters',e)}
  }

  function ensureDateDropdownOnly(){
    removeLegacyDateFilters();
  }

  function cleanAffairesUI(){
    removeDuplicateReminder();
    removeLegacyDateFilters();
    ensureDateDropdownOnly();
    removeDuplicateReminder();
    highlightFutureDates();
  }

  // Appliquer après chaque rendu / clic car d'anciens patchs recréent parfois ces blocs.
  document.addEventListener('DOMContentLoaded',function(){setTimeout(cleanAffairesUI,80);setTimeout(cleanAffairesUI,500);});
  document.addEventListener('click',function(){setTimeout(cleanAffairesUI,80);setTimeout(cleanAffairesUI,350);},true);

  var oldShow=window.showScreen;
  if(typeof oldShow==='function' && !oldShow._dcb002nWrapped){
    window.showScreen=function(name){
      var r=oldShow.apply(this,arguments);
      if(name==='affaires'){setTimeout(cleanAffairesUI,0);setTimeout(cleanAffairesUI,180);setTimeout(cleanAffairesUI,520)}
      return r;
    };
    window.showScreen._dcb002nWrapped=true;
  }
  var oldRenderAff=window.renderAffaires;
  if(typeof oldRenderAff==='function' && !oldRenderAff._dcb002nWrapped){
    window.renderAffaires=function(){
      var r=oldRenderAff.apply(this,arguments);
      setTimeout(cleanAffairesUI,0);setTimeout(cleanAffairesUI,220);
      return r;
    };
    window.renderAffaires._dcb002nWrapped=true;
  }

  // Observer ciblé sur AFFAIRES : dès qu'un ancien bloc revient, on le retire.
  function installObserver(){
    var root=byId('affaires-content');
    if(!root || root._dcb002nObserver)return;
    root._dcb002nObserver=true;
    var mo=new MutationObserver(function(){setTimeout(cleanAffairesUI,0)});
    mo.observe(root,{childList:true,subtree:true});
  }
  setTimeout(function(){installObserver();cleanAffairesUI()},300);
  setTimeout(function(){installObserver();cleanAffairesUI()},1000);
  window.DAF_COMMERCEBOX_B002N_AFFAIRES_FIX=cleanAffairesUI;
})();
</script>



<script>
// ============================================================
// DAF_COMMERCE-Box — AUDIT KPI MARCHÉ vs TOURNÉES
// Ajout non destructif : compare les règles sans modifier les KPI existants.
// ============================================================
(function(){
  'use strict';
  function byId(id){return document.getElementById(id);}
  function all(sel,root){return Array.prototype.slice.call((root||document).querySelectorAll(sel));}
  function h(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function nrm(s){try{return norm(s);}catch(e){return String(s||'').trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}}
  function siret(v){try{return normSiret(v&&v.siret);}catch(e){return String((v&&v.siret)||'').replace(/\D/g,'');}}
  function vKey(v){return [siret(v),v&&v.plaque||'',v&&v.date||'',v&&v.chassis||'',marketBrand(v),v&&v.type||''].map(function(x){return nrm(x);}).join('|');}
  function uniqVeh(list){var seen={},out=[];(list||[]).forEach(function(v){var k=vKey(v);if(!seen[k]){seen[k]=true;out.push(v);}});return out;}
  function clientForVehicle(v){var sr=siret(v);return sr && IDX && IDX.cBySiret ? IDX.cBySiret[sr] : null;}
  function siteKeyForClient(c){try{return c._siteKey||makeSiteKey(c);}catch(e){return c&&c._siteKey||'';}}
  function getToursFilter(){try{return window.toursF||toursF||'all';}catch(e){return 'all';}}
  function getToursSearch(){try{return (window.toursSearch || (typeof toursSearch!=='undefined'?toursSearch:'') || '').toLowerCase().trim();}catch(e){return '';}}

  function ensureAuditScreen(){
    if(!byId('screen-audit')){
      var more=byId('screen-more')||all('.screen').slice(-1)[0];
      var div=document.createElement('div');
      div.className='screen';
      div.id='screen-audit';
      div.innerHTML='<div class="screen-header"><div class="screen-title">🧪 Audit KPI</div><div class="screen-sub">Comparaison MARCHÉ vs TOURNÉES</div></div><div id="audit-content" style="padding-top:6px;"></div>';
      if(more&&more.parentNode)more.parentNode.insertBefore(div,more);else document.body.appendChild(div);
    }
  }

  function baseToursRows(applyMasks, applyCurrentFilter){
    var data=[];
    try{data=buildToursData();}catch(e){data=[];}
    var search=applyCurrentFilter?getToursSearch():'';
    var f=applyCurrentFilter?getToursFilter():'all';
    return data.filter(function(c){
      if(applyMasks && typeof passesToursExclusions==='function' && !passesToursExclusions(c))return false;
      if(search && [c.nom,c.ville,c.canton,c.vendeur,c.profil,c.tva,c.siret,c.groupement].join(' ').toLowerCase().indexOf(search)<0)return false;
      switch(f){
        case 'daf_with':return c.dafCount>0;
        case 'no_daf':return c.dafCount===0;
        case 'urgent':return _toursUrgentForKpi(c);
        case 'flotte':return c.isFlotte;
        case 'protocole':return !!c.groupement;
        case 'daf_renew_kpi':case 'daf_renew':return c.dafRenew>0;
        case 'hors_renew_kpi':case 'conc_renew':return c.horsRenew>0;
        default:return true;
      }
    });
  }

  function vehiclesFromToursRows(rows){
    try{if(typeof _dedupVehiclesFromRows==='function')return uniqVeh(_dedupVehiclesFromRows(rows)).filter(function(v){return v.possession!==false && (typeof matchesToursVehicle!=='function'||matchesToursVehicle(v));});}catch(e){}
    var list=[];(rows||[]).forEach(function(c){
      try{list=list.concat(getSiteVehicles(c._siteKey||siteKeyForClient(c))||[]);}catch(e){}
    });
    return uniqVeh(list).filter(function(v){return v.possession!==false && (typeof matchesToursVehicle!=='function'||matchesToursVehicle(v));});
  }

  function marketVehiclesCurrent(){
    var vv=[];try{vv=(DB.getVehicles()||[]).filter(function(v){return typeof matchesMarcheVehicle!=='function'||matchesMarcheVehicle(v);});}catch(e){vv=[];}
    return uniqVeh(vv);
  }
  function marketVehiclesAttached(){
    return marketVehiclesCurrent().filter(function(v){return !!clientForVehicle(v);});
  }

  function kpisFromVehicles(label, veh, rows, mode){
    veh=uniqVeh(veh||[]); rows=rows||[]; mode=mode||'tours';
    var daf=veh.filter(isDaf).length;
    var renewDafFn=mode==='marche'?isRenewDafMarche:isRenewDaf;
    var renewHorsFn=mode==='marche'?isRenewHorsMarche:isRenewHors;
    return {
      label:label,
      veh:veh,
      rows:rows,
      parc:veh.length,
      daf:daf,
      horsDaf:veh.length-daf,
      dafRenew:veh.filter(function(v){try{return renewDafFn(v);}catch(e){return false;}}).length,
      horsRenew:veh.filter(function(v){try{return renewHorsFn(v);}catch(e){return false;}}).length,
      sites:rows.length,
      sansDaf:rows.filter(function(c){return (c.dafCount||0)===0;}).length,
      urgents:rows.filter(function(c){try{return _toursUrgentForKpi(c);}catch(e){return !!c.isUrgent;}}).length
    };
  }

  function diffVehicles(a,b){
    var bm={};(b||[]).forEach(function(v){bm[vKey(v)]=true;});
    return (a||[]).filter(function(v){return !bm[vKey(v)];});
  }

  function reasonVehicleMissingFromTours(v){
    var reasons=[];
    var sr=siret(v);
    var c=clientForVehicle(v);
    if(!sr)reasons.push('SIRET absent dans immat');
    if(sr&&!c)reasons.push('SIRET immat non trouvé dans CRM');
    if(v.possession===false)reasons.push('véhicule marqué non possédé');
    if(c){
      var sk=siteKeyForClient(c);
      var row=null;try{row=buildToursData().find(function(x){return (x._siteKey||siteKeyForClient(x))===sk;});}catch(e){}
      try{if(typeof clientMatchesGF==='function'&&!clientMatchesGF(c))reasons.push('filtre global client/vendeur/pays/département/profil');}catch(e){}
      try{if(typeof matchesToursVehicle==='function'&&!matchesToursVehicle(v))reasons.push('filtre véhicule Tournées');}catch(e){}
      if(row){
        var maskRs=toursMaskExcludeReasons(row);
        if(maskRs.length)reasons=reasons.concat(maskRs);
      }
    }
    return reasons.length?reasons.join(' + '):'à contrôler : écart non expliqué automatiquement';
  }

  function reasonVehicleMissingFromMarket(v){
    var reasons=[];
    try{if(typeof matchesMarcheVehicle==='function'&&!matchesMarcheVehicle(v))reasons.push('filtre Marché');}catch(e){}
    if(v.possession===false)reasons.push('non possédé');
    var c=clientForVehicle(v);
    if(c){
      try{if(GF.exclExclusionMarche&&isClientExcludedMarche(c))reasons.push('Exclusion ON Marché : EXCLU_MANUEL');}catch(e){}
      try{if(GF.exclInactifsMarche&&isInactiveClientMarche(c.tva,siteKeyForClient(c)))reasons.push('Inactifs ON Marché');}catch(e){}
      try{if(GF.exclAccessibleOffMarche&&!isClientAccessible(c))reasons.push('Accessible OFF ON Marché');}catch(e){}
      try{if(GF.exclFlotteNationaleMarche&&isFlotteNationale(c))reasons.push('Hors Flotte NAT. Marché');}catch(e){}
    }
    return reasons.length?reasons.join(' + '):'à contrôler : présent Tournées mais absent Marché';
  }

  function rowForVehicle(v,reason){
    var c=clientForVehicle(v);
    return '<tr><td>'+h(v.plaque||'—')+'</td><td>'+h(marketBrand(v))+'</td><td>'+h(v.type||'—')+'</td><td>'+h(v.date||'—')+'</td><td>'+h(siret(v)||'—')+'</td><td>'+h(c?(c.nom||''):'—')+'</td><td>'+h(reason||'')+'</td></tr>';
  }
  function smallTable(list,reasonFn,max){
    max=max||80;
    if(!list.length)return '<div style="font-size:11px;color:var(--green);padding:8px 0;">Aucun écart détecté.</div>';
    var rows=list.slice(0,max).map(function(v){return rowForVehicle(v,reasonFn(v));}).join('');
    var extra=list.length>max?'<div style="font-size:10px;color:var(--orange);padding:6px 0;">Affichage limité à '+max+' lignes sur '+list.length+'.</div>':'';
    return extra+'<div style="overflow:auto;max-height:360px;border:1px solid var(--border);border-radius:8px;"><table style="width:100%;border-collapse:collapse;font-size:10px;"><thead><tr style="color:var(--text3);"><th>Plaque</th><th>Marque</th><th>Type</th><th>Date</th><th>SIRET</th><th>Client</th><th>Raison probable</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  }

  function renderAuditKpi(){
    ensureAuditScreen();
    try{buildIndex();}catch(e){}
    var allImport=uniqVeh(DB.getVehicles()||[]);
    var mVeh=marketVehiclesCurrent();
    var mAttached=marketVehiclesAttached();
    var tRowsRaw=baseToursRows(false,false);
    var tVehRaw=vehiclesFromToursRows(tRowsRaw);
    var tRowsCurrent=baseToursRows(true,true);
    var tVehCurrent=vehiclesFromToursRows(tRowsCurrent);
    var M=kpisFromVehicles('MARCHÉ (filtres actifs)',mVeh,[],'marche');
    var MA=kpisFromVehicles('MARCHÉ rattaché SIRET',mAttached,[],'marche');
    var TR=kpisFromVehicles('TOURNÉES brut',tVehRaw,tRowsRaw,'tours');
    var TC=kpisFromVehicles('TOURNÉES actuel',tVehCurrent,tRowsCurrent,'tours');
    var missTours=diffVehicles(mVeh,tVehCurrent);
    var missMarket=diffVehicles(tVehCurrent,mVeh);
    var structural=diffVehicles(mVeh,tVehRaw);
    var kpiRows=[
      ['Parc total',M.parc,TC.parc,M.parc-TC.parc],
      ['DAF total',M.daf,TC.daf,M.daf-TC.daf],
      ['Hors DAF total',M.horsDaf,TC.horsDaf,M.horsDaf-TC.horsDaf],
      ['DAF à renouveler',M.dafRenew,TC.dafRenew,M.dafRenew-TC.dafRenew],
      ['Hors DAF à renouveler',M.horsRenew,TC.horsRenew,M.horsRenew-TC.horsRenew]
    ];
    var kpiHtml=kpiRows.map(function(r){var cls=r[3]===0?'var(--green)':(Math.abs(r[3])>0?'var(--orange)':'var(--text2)');return '<tr><td>'+h(r[0])+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td style="font-weight:900;color:'+cls+';">'+(r[3]>0?'+':'')+r[3]+'</td></tr>';}).join('');
    var state='<div style="font-size:10px;color:var(--text3);line-height:1.5;">Filtres actuels : type <strong>'+h(GF.marcheTypeFilter||'tous')+'</strong> · vendeurs MARCHÉ <strong>'+h((GF.vendeursMarche&&GF.vendeursMarche.length?GF.vendeursMarche.join(', '):'tous'))+'</strong> · Tournées <strong>'+h(getToursFilter())+'</strong> · masques : '+h(_formatToursMaskStates())+' · Marché accessible OFF '+(GF.exclAccessibleOffMarche?'ON':'OFF')+'.</div>';
    var html='';
    html+='<div class="card"><div class="card-title">Méthode d’audit</div><div style="font-size:12px;color:var(--text2);line-height:1.5;">Cette page ne corrige rien : elle compare les véhicules comptés par MARCHÉ avec ceux réellement repris par TOURNÉES, puis donne la raison probable de chaque écart.</div>'+state+'<div style="display:flex;gap:6px;margin-top:8px;"><button class="btn btn-primary btn-sm" id="audit-refresh">Recalculer</button><button class="btn btn-secondary btn-sm" id="audit-export">Exporter CSV écarts</button></div></div>';
    html+='<div class="kpi-grid"><div class="kpi-card"><div class="kpi-val">'+allImport.length+'</div><div class="kpi-lbl">Lignes immat importées</div></div><div class="kpi-card"><div class="kpi-val">'+M.parc+'</div><div class="kpi-lbl">Parc Marché (filtres)</div></div><div class="kpi-card c-blue"><div class="kpi-val">'+TC.parc+'</div><div class="kpi-lbl">Parc Tournées actuel</div></div><div class="kpi-card c-orange"><div class="kpi-val">'+missTours.length+'</div><div class="kpi-lbl">Marché absent Tournées</div></div></div>';
    html+='<div class="card"><div class="card-title">Comparaison KPI visibles</div><div style="overflow:auto;"><table style="width:100%;border-collapse:collapse;font-size:11px;"><thead><tr style="color:var(--text3);"><th style="text-align:left;">KPI</th><th>Marché</th><th>Tournées</th><th>Écart</th></tr></thead><tbody>'+kpiHtml+'</tbody></table></div></div>';
    html+='<div class="card"><div class="card-title">Contrôle structurel SIRET</div><div style="font-size:11px;color:var(--text2);line-height:1.5;">Marché rattaché SIRET : <strong>'+MA.parc+'</strong> véhicules. Tournées brut sans masques : <strong>'+TR.parc+'</strong> véhicules sur <strong>'+TR.sites+'</strong> sites. Écart structurel : <strong style="color:'+(structural.length?'var(--orange)':'var(--green)')+'">'+structural.length+'</strong>.</div>'+smallTable(structural,reasonVehicleMissingFromTours,50)+'</div>';
    html+='<div class="card"><div class="card-title">Véhicules comptés dans MARCHÉ mais absents de TOURNÉES actuel</div>'+smallTable(missTours,reasonVehicleMissingFromTours,100)+'</div>';
    html+='<div class="card"><div class="card-title">Véhicules comptés dans TOURNÉES mais absents de MARCHÉ actuel</div>'+smallTable(missMarket,reasonVehicleMissingFromMarket,80)+'</div>';
    var root=byId('audit-content');if(root)root.innerHTML=html;
    var ref=byId('audit-refresh');if(ref)ref.onclick=renderAuditKpi;
    var exp=byId('audit-export');if(exp)exp.onclick=function(){exportAuditCsv(missTours,missMarket);};
  }

  function exportAuditCsv(missTours,missMarket){
    var rows=[['Sens','Plaque','Marque','Type','Date','SIRET','Client','Raison probable']];
    (missTours||[]).forEach(function(v){var c=clientForVehicle(v);rows.push(['Marché absent Tournées',v.plaque||'',marketBrand(v),v.type||'',v.date||'',siret(v),c?c.nom||'':'',reasonVehicleMissingFromTours(v)]);});
    (missMarket||[]).forEach(function(v){var c=clientForVehicle(v);rows.push(['Tournées absent Marché',v.plaque||'',marketBrand(v),v.type||'',v.date||'',siret(v),c?c.nom||'':'',reasonVehicleMissingFromMarket(v)]);});
    var csv=rows.map(function(r){return r.map(function(x){return '"'+String(x==null?'':x).replace(/"/g,'""')+'"';}).join(';');}).join('\n');
    var blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='audit_kpi_marche_tournees.csv';document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(a.href);},500);try{toast('Audit CSV exporté');}catch(e){}
  }

  function injectAuditButton(){
    var more=byId('more-content');if(!more||byId('btn-open-audit-kpi'))return;
    var card=document.createElement('div');card.className='card';card.innerHTML='<div class="card-title">🧪 Audit KPI</div><div style="font-size:11px;color:var(--text3);margin-bottom:8px;line-height:1.4;">Compare MARCHÉ et TOURNÉES, puis liste les véhicules qui créent les écarts.</div><button class="btn btn-primary" id="btn-open-audit-kpi" style="width:100%;">Ouvrir Audit KPI</button>';
    more.insertBefore(card,more.firstChild);
    byId('btn-open-audit-kpi').onclick=function(){try{showScreen('audit');}catch(e){ensureAuditScreen();all('.screen').forEach(function(s){s.classList.remove('active');});byId('screen-audit').classList.add('active');renderAuditKpi();}};
  }

  var oldRenderMore=window.renderMore;
  if(typeof oldRenderMore==='function'){
    window.renderMore=function(){var r=oldRenderMore.apply(this,arguments);setTimeout(function(){injectAuditButton();bindBasesEvents();if(typeof renderMoreAdminFooter==='function')renderMoreAdminFooter();},0);return r;};
  }
  var oldRenderScreen=window.renderScreen;
  window.renderScreen=function(name){if(name==='audit'){renderAuditKpi();return;}return oldRenderScreen?oldRenderScreen.apply(this,arguments):undefined;};
  var oldShow=window.showScreen;
  window.showScreen=function(name){ensureAuditScreen();var r=oldShow?oldShow.apply(this,arguments):undefined;if(name==='audit'){all('.screen').forEach(function(s){s.classList.remove('active');});all('.nav-item').forEach(function(n){n.classList.remove('active');});byId('screen-audit').classList.add('active');renderAuditKpi();}if(name==='more')setTimeout(injectAuditButton,120);return r;};
  document.addEventListener('DOMContentLoaded',function(){ensureAuditScreen();setTimeout(injectAuditButton,300);});
  window.renderAuditKpi=renderAuditKpi;
})();
</script>

<script>

// ===== PATCH FILTRE VENDEUR MARCHÉ UNIQUEMENT =====
(function(){
  var _lastRenderMarcheForVendorOnly = window.renderMarche;
  if(typeof _lastRenderMarcheForVendorOnly==='function'){
    window.renderMarche=function(){
      var r=_lastRenderMarcheForVendorOnly.apply(this,arguments);

// ============================================================
// PATCH FINAL — FILTRES VENDEUR VISIBLES ET SÉPARÉS
// Objectif :
// 1) VENDEUR MARCHÉ visible dans la barre MARCHÉ, impact MARCHÉ uniquement.
// 2) VENDEUR TOURNÉES visible dans la barre TOURNÉES, impact TOURNÉES uniquement.
// 3) Injection après rendu pour éviter les problèmes de DOM inexistant.
// ============================================================
(function(){
  if(window.__patchVendeurVisibleCB)return;
  window.__patchVendeurVisibleCB=true;

  function byId(id){return document.getElementById(id);}
  function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function nrm(s){try{return norm(s);}catch(e){return String(s||'').trim().toUpperCase();}}

  function ensureStates(){
    if(typeof GF==='undefined')window.GF={};
    if(!Array.isArray(GF.vendeursMarche))GF.vendeursMarche=[];
    if(!Array.isArray(GF.vendeursTours))GF.vendeursTours=[];
  }

  function distinctVendeurs(){
    ensureStates();
    var set={};
    try{(DB.getClients()||[]).forEach(function(c){var v=String((c&&c.vendeur)||'').trim();if(v)set[v]=true;});}catch(e){}
    return Object.keys(set).sort(function(a,b){return a.localeCompare(b,'fr');});
  }

  function makeFilter(kind){
    ensureStates();
    var arr=kind==='marche'?GF.vendeursMarche:GF.vendeursTours;
    var vals=distinctVendeurs();
    if(!vals.length)return '';
    var title=kind==='marche'?'Vendeur Marché':'Vendeur Tournées';
    var label=arr.length?(title+' ('+arr.length+')'):(title+' ▼');
    var cls='gf-chip'+(arr.length?' on':'');
    return '<div class="vendeur-filter-visible" id="vf-wrap-'+kind+'" style="position:relative;display:inline-flex;align-items:center;">'
      +'<button type="button" class="'+cls+'" id="vf-btn-'+kind+'" style="font-size:9px;font-weight:800;">'+esc(label)+'</button>'
      +'<div id="vf-drop-'+kind+'" style="display:none;position:fixed;z-index:99999;background:var(--bg2);border:1px solid var(--border2);border-radius:12px;min-width:220px;max-height:310px;overflow-y:auto;box-shadow:0 12px 32px rgba(0,0,0,.75);">'
      +'<div style="position:sticky;top:0;background:var(--bg2);padding:8px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;">'
      +'<strong style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;">'+esc(title)+'</strong>'
      +'<button type="button" id="vf-reset-'+kind+'" style="background:none;border:none;color:var(--daf);font-size:10px;font-weight:800;">Tous</button>'
      +'</div>'
      + vals.map(function(v){
        var checked=arr.indexOf(v)>=0;
        return '<label style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--border);font-size:12px;color:var(--text2);">'
          +'<input type="checkbox" data-kind="'+kind+'" data-vendeur="'+esc(v)+'" '+(checked?'checked':'')+' style="width:15px;height:15px;accent-color:var(--daf);">'
          +'<span style="white-space:normal;line-height:1.25;">'+esc(v)+'</span>'
          +'</label>';
      }).join('')
      +'</div></div>';
  }

  function bindFilter(kind){
    var btn=byId('vf-btn-'+kind), drop=byId('vf-drop-'+kind), wrap=byId('vf-wrap-'+kind);
    if(!btn||!drop||!wrap)return;
    btn.onclick=function(e){
      e.preventDefault();e.stopPropagation();
      var open=drop.style.display==='block';
      document.querySelectorAll('.vendeur-filter-visible > div[id^="vf-drop-"]').forEach(function(d){d.style.display='none';});
      if(!open){
        var r=btn.getBoundingClientRect();
        drop.style.display='block';
        drop.style.top=(r.bottom+5)+'px';
        drop.style.left=Math.max(6,Math.min(r.left,window.innerWidth-230))+'px';
      }
    };
    var reset=byId('vf-reset-'+kind);
    if(reset)reset.onclick=function(e){
      e.preventDefault();e.stopPropagation();
      if(kind==='marche')GF.vendeursMarche=[];else GF.vendeursTours=[];
      refreshKind(kind);
    };
    drop.querySelectorAll('input[type="checkbox"]').forEach(function(cb){
      cb.onchange=function(){
        var v=this.getAttribute('data-vendeur');
        var arr=kind==='marche'?GF.vendeursMarche:GF.vendeursTours;
        if(this.checked){if(arr.indexOf(v)<0)arr.push(v);}else{arr=arr.filter(function(x){return x!==v;});}
        if(kind==='marche')GF.vendeursMarche=arr;else GF.vendeursTours=arr;
        refreshKind(kind);
      };
    });
  }

  function refreshKind(kind){
    try{invalidateCache();}catch(e){}
    try{buildIndex();}catch(e){}
    if(kind==='marche'){
      try{renderMarche();}catch(e){console.error(e);}
    }else{
      try{renderTours();}catch(e){console.error(e);}
    }
  }

  function injectMarche(){
    ensureStates();
    var bar=byId('marche-sticky-bar');
    if(!bar)return;
    var old=byId('vf-wrap-marche'); if(old)old.remove();
    var tmp=document.createElement('div'); tmp.innerHTML=makeFilter('marche');
    if(tmp.firstElementChild)bar.insertBefore(tmp.firstElementChild,bar.firstChild);
    bindFilter('marche');
  }

  function injectTours(){
    ensureStates();
    var bar=byId('tours-mask-bar');
    if(!bar)return;
    var old=byId('vf-wrap-tours'); if(old)old.remove();
    var tmp=document.createElement('div'); tmp.innerHTML=makeFilter('tours');
    var node=tmp.firstElementChild;
    if(node)bar.insertBefore(node,bar.firstChild);
    bindFilter('tours');
  }

  // TOURNÉES : filtre vendeur indépendant, appliqué au niveau site/client.
  if(typeof buildToursData==='function'){
    var __oldBuildToursData=buildToursData;
    buildToursData=function(){
      var data=__oldBuildToursData.apply(this,arguments)||[];
      ensureStates();
      if(GF.vendeursTours&&GF.vendeursTours.length){
        data=data.filter(function(c){return GF.vendeursTours.some(function(v){return nrm(c&&c.vendeur)===nrm(v);});});
      }
      return data;
    };
  }

  // MARCHÉ : si une version de matchesMarcheClient est utilisée par certains blocs, on sécurise aussi ici.
  if(typeof matchesMarcheClient==='function'){
    var __oldMatchesMarcheClient=matchesMarcheClient;
    matchesMarcheClient=function(c){
      ensureStates();
      if(GF.vendeursMarche&&GF.vendeursMarche.length&&!GF.vendeursMarche.some(function(v){return nrm(c&&c.vendeur)===nrm(v);}))return false;
      return __oldMatchesMarcheClient.apply(this,arguments);
    };
  }

  if(typeof renderMarche==='function'){
    var __oldRenderMarche=renderMarche;
    renderMarche=function(){var r=__oldRenderMarche.apply(this,arguments);setTimeout(injectMarche,0);return r;};
  }
  if(typeof renderTours==='function'){
    var __oldRenderTours=renderTours;
    renderTours=function(){var r=__oldRenderTours.apply(this,arguments);setTimeout(injectTours,0);return r;};
  }

  document.addEventListener('click',function(e){
    if(!e.target.closest || !e.target.closest('.vendeur-filter-visible')){
      document.querySelectorAll('.vendeur-filter-visible > div[id^="vf-drop-"]').forEach(function(d){d.style.display='none';});
    }
  },true);

  // Injection au chargement / après import / après navigation.
  setTimeout(function(){try{injectMarche();injectTours();}catch(e){}},250);
})();
</script>

<script>
/* DAF_COMMERCE-Box — bases-v17 : cascade PROJET=AFFAIRE=COMMISSIONS, surbrillance, recherche sticky */
(function(){
  'use strict';
  var HL='2px solid var(--orange)';
  function byId(id){return document.getElementById(id);}
  function qsa(sel,root){return Array.prototype.slice.call((root||document).querySelectorAll(sel));}
  function getStore(k){try{return arr(DB.get(k));}catch(e){return [];}}
  function setStore(k,v){try{DB.set(k,arr(v));if(typeof autoSave==='function')autoSave();}catch(e){}}
  function dealIdsForProject(pid,dealId){
    var ids=[], pidS=String(pid||'');
    if(dealId)ids.push(String(dealId));
    getStore('hotDeals').forEach(function(d){if(String(d.projectId)===pidS)ids.push(String(d.id));});
    getStore('hotDealArchives').forEach(function(d){if(String(d.projectId)===pidS)ids.push(String(d.id));});
    var out=[], seen={};
    ids.forEach(function(id){if(id&&!seen[id]){seen[id]=1;out.push(id);}});
    return out;
  }
  window.deleteProjectBundle=function(pid,opts){
    opts=opts||{};
    pid=String(pid||'');
    if(!pid){try{toast('Projet introuvable');}catch(e){}return false;}
    if(!opts.skipConfirm&&!confirm('Supprimer ce projet, son affaire et les commissions liées ?'))return false;
    var dealIds=dealIdsForProject(pid,opts.dealId);
    var liv=getStore('deliveries').filter(function(x){
      if(String(x.projectId)===pid)return false;
      if(dealIds.some(function(id){return String(x.dealId)===id;}))return false;
      if(dealIds.some(function(id){return String(x.sourceId||'').indexOf(id+'|')===0;}))return false;
      return true;
    });
    setStore('deliveries',liv);
    setStore('hotDeals',getStore('hotDeals').filter(function(d){return String(d.projectId)!==pid&&!dealIds.some(function(id){return String(d.id)===id;});}));
    setStore('hotDealArchives',getStore('hotDealArchives').filter(function(d){return String(d.projectId)!==pid&&!dealIds.some(function(id){return String(d.id)===id;});}));
    try{DB.saveProjects((DB.getProjects()||[]).filter(function(p){return String(p.id)!==pid;}));}catch(e){}
    try{buildIndex();}catch(e){}
    try{if(typeof invalidateCache==='function')invalidateCache();}catch(e){}
    try{if(typeof renderAffaires==='function')renderAffaires();}catch(e){}
    try{if(typeof renderCommissions==='function')renderCommissions();}catch(e){}
    if(currentScreen==='projets')try{renderProjets();}catch(e){}
    if(currentScreen==='tours')try{renderTours();}catch(e){}
    if(opts.sk)try{openSiteSheet(opts.sk);}catch(e){}
    else if(opts.tva)try{openClientSheet(opts.tva);}catch(e){}
    try{toast('Projet, affaire et commissions supprimés');}catch(e){}
    return true;
  };
  window.deleteAffaireBundle=function(dealId,pid){
    dealId=String(dealId||'');
    if(!dealId)return false;
    if(!pid){
      var d=getStore('hotDeals').find(function(x){return String(x.id)===dealId;})||getStore('hotDealArchives').find(function(x){return String(x.id)===dealId;});
      pid=d&&d.projectId;
    }
    if(pid){if(!confirm('Supprimer cette affaire, le projet lié et les commissions ?'))return false;return window.deleteProjectBundle(pid,{dealId:dealId,skipConfirm:true});}
    if(!confirm('Supprimer cette affaire et ses commissions ?'))return false;
    var liv=getStore('deliveries').filter(function(x){return String(x.dealId)!==dealId&&String(x.sourceId||'').indexOf(dealId+'|')!==0;});
    setStore('deliveries',liv);
    setStore('hotDeals',getStore('hotDeals').filter(function(d){return String(d.id)!==dealId;}));
    setStore('hotDealArchives',getStore('hotDealArchives').filter(function(d){return String(d.id)!==dealId;}));
    try{buildIndex();}catch(e){}
    try{if(typeof renderAffaires==='function')renderAffaires();}catch(e){}
    try{if(typeof renderCommissions==='function')renderCommissions();}catch(e){}
    try{toast('Affaire supprimée');}catch(e){}
    return true;
  };
  window.refreshLinkedAfterAffaireChange=function(d){
    try{buildIndex();}catch(e){}
    try{if(typeof renderCommissions==='function')renderCommissions();}catch(e){}
    if(currentScreen==='tours')try{renderTours();}catch(e){}
    var sk=d&&d.siteKey;
    if(!sk&&d&&d.tva){try{var c=IDX.cByTva&&IDX.cByTva[d.tva];if(c)sk=c._siteKey||makeSiteKey(c);}catch(e){}}
    var sheet=byId('sheet');
    if(sk&&sheet&&sheet.classList.contains('open'))try{openSiteSheet(sk);}catch(e){}
  };
  function arr(x){return Array.isArray(x)?x:[];}
  function highlightAffaireCard(dealId,seq){
    if(!dealId)return;
    seq=seq||window._affHighlightSeq||0;
    qsa('#affaires-content [data-deal-id], #affaires-content-inner [data-deal-id]').forEach(function(el){
      el.classList.remove('affaire-selected-v17');
      el.style.outline='';
      el.style.outlineOffset='';
    });
    setTimeout(function(){
      if(seq&&seq!==window._affHighlightSeq)return;
      var q='#affaires-content [data-deal-id="'+String(dealId).replace(/"/g,'\\"')+'"], #affaires-content-inner [data-deal-id="'+String(dealId).replace(/"/g,'\\"')+'"]';
      var el=document.querySelector(q);
      if(!el)return;
      el.classList.add('affaire-selected-v17');
      el.style.outline=HL;
      el.style.outlineOffset='3px';
      el.scrollIntoView({behavior:'smooth',block:'start'});
    },160);
  }
  var _prevOpenDeal=window.openDealV213;
  window.openDealV213=function(dealId){
    if(!dealId)return;
    window.affaireHighlightId=String(dealId);
    window.affaireSingleId=dealId;
    window._affHighlightSeq=(window._affHighlightSeq||0)+1;
    var seq=window._affHighlightSeq;
    if(typeof _prevOpenDeal==='function')_prevOpenDeal(dealId);
    else{
      try{if(typeof showScreen==='function')showScreen('affaires');}catch(e){}
      try{if(typeof renderAffaires==='function')renderAffaires();}catch(e){}
    }
    setTimeout(function(){highlightAffaireCard(dealId,seq);},220);
    setTimeout(function(){highlightAffaireCard(dealId,seq);},650);
  };
  window.openDealFromCommission=function(id){if(id)window.openDealV213(id);};
  function patchAffairesButtons(){
    qsa('#affaires-content button, #affaires-content-inner button').forEach(function(b){
      var t=(b.textContent||'').replace(/\s+/g,' ').trim();
      if(/dupliquer/i.test(t)||b.classList.contains('dup-aff-line')||b.classList.contains('btn-dupe-line')||b.classList.contains('btn-dupe-last')||b.classList.contains('btn-dup-line')||b.classList.contains('veh-dup'))b.remove();
    });
    qsa('#affaires-content .add-aff-line, #affaires-content .v29-add, #affaires-content .btn-add-line').forEach(function(b){
      if(b.classList.contains('del-aff-deal'))return;
      var card=b.closest('[data-deal-id]');
      b.textContent='Supprimer';
      b.className='btn btn-red btn-sm del-aff-deal';
      if(!b.dataset.id&&card)b.dataset.id=card.getAttribute('data-deal-id')||'';
      if(!b._v17Bound){
        b._v17Bound=true;
        b.onclick=function(e){e.stopPropagation();window.deleteAffaireBundle(this.dataset.id,this.dataset.pid);};
      }
    });
  }
  function syncAffairesSearchBar(){
    var input=byId('affaires-search-sticky');
    if(!input)return;
    if(window.affairesSearch!=null&&input.value!==window.affairesSearch)input.value=window.affairesSearch;
    var bar=byId('affaires-search-bar-sticky')||input.closest('.search-bar');
    if(!bar)return;
    var btn=byId('cb-affaires-search-clear');
    if(!btn){
      btn=document.createElement('button');
      btn.id='cb-affaires-search-clear';
      btn.type='button';
      btn.textContent='✕';
      btn.className='btn btn-ghost btn-sm';
      btn.style.cssText='min-width:30px;height:30px;padding:0;border-radius:50%;font-size:13px;line-height:1;display:none;align-items:center;justify-content:center;';
      bar.appendChild(btn);
    }
    function updateAffSearchVisual(){
      var active=!!String(input.value||'').trim();
      bar.style.outline=active?HL:'';
      bar.style.outlineOffset=active?'2px':'';
      btn.style.outline=active?HL:'';
      btn.style.display=active?'inline-flex':'none';
    }
    if(!btn._v17Bound){
      btn._v17Bound=true;
      btn.onclick=function(){
        input.value='';
        window.affairesSearch='';
        updateAffSearchVisual();
        try{if(typeof renderAffaires==='function')renderAffaires();}catch(e){}
        input.focus();
      };
    }
    if(!input._v17SearchBound){
      input._v17SearchBound=true;
      input.oninput=function(){
        window.affairesSearch=this.value;
        updateAffSearchVisual();
        try{if(typeof renderAffaires==='function')renderAffaires();}catch(e){}
      };
    }
    updateAffSearchVisual();
  }
  var _prevRA=window.renderAffaires;
  if(typeof _prevRA==='function'&&!_prevRA._v17Wrapped){
    window.renderAffaires=function(){
      var r=_prevRA.apply(this,arguments);
      setTimeout(function(){syncAffairesSearchBar();patchAffairesButtons();if(window.affaireHighlightId)highlightAffaireCard(window.affaireHighlightId,window._affHighlightSeq);},0);
      setTimeout(function(){syncAffairesSearchBar();patchAffairesButtons();},150);
      return r;
    };
    window.renderAffaires._v17Wrapped=true;
  }
  var _prevShow=window.showScreen;
  window.showScreen=function(name){
    var r=_prevShow?_prevShow.apply(this,arguments):undefined;
    if(name==='affaires')setTimeout(function(){syncAffairesSearchBar();patchAffairesButtons();},60);
    return r;
  };
  var affCont=byId('affaires-content');
  if(affCont&&!affCont._v17Obs){
    affCont._v17Obs=true;
    new MutationObserver(function(){setTimeout(function(){patchAffairesButtons();},0);}).observe(affCont,{childList:true,subtree:true});
  }
  setTimeout(function(){syncAffairesSearchBar();patchAffairesButtons();},300);
  setTimeout(function(){syncAffairesSearchBar();},800);
})();
</script>

<script>
/* DAF_COMMERCE-Box — v21 : suppression définitive filtre Affaires — dates */

      var t=(card.textContent||'').replace(/\s+/g,' ').trim().toLowerCase();

</script>

<script>
/* === v24 — Navigation fiche client → Affaire + surlignage fiable === */
(function(){
  'use strict';
  function byId(id){return document.getElementById(id);}
  function qsa(sel,root){return Array.prototype.slice.call((root||document).querySelectorAll(sel));}
  function getDeals(){
    try{return DB.get('hotDeals')||[];}catch(e){try{return JSON.parse(localStorage.getItem('hotDeals')||'[]');}catch(_){return [];}}
  }
  function dealForProjectId(pid){
    pid=String(pid||'');
    if(!pid)return null;
    var matches=getDeals().filter(function(d){return String(d.projectId||'')===pid;});
    if(!matches.length)return null;
    if(matches.length===1)return matches[0];
    return matches.slice().sort(function(a,b){return String(b.created||'').localeCompare(String(a.created||''));})[0];
  }
  function ensureDealForProject(p){
    if(!p||!p.id)return null;
    if(typeof window.ensureDealFromProjectV27==='function'){
      try{var d=window.ensureDealFromProjectV27(p);if(d)return d;}catch(e){}
    }
    return dealForProjectId(p.id);
  }
  var HL='2px solid var(--orange)';
  function highlightDeal(dealId,seq){
    if(!dealId)return;
    seq=seq||window._affHighlightSeq||0;
    qsa('#affaires-content [data-deal-id], #affaires-content-inner [data-deal-id]').forEach(function(el){
      el.classList.remove('affaire-selected-v17');
      el.style.outline='';
      el.style.outlineOffset='';
    });
    setTimeout(function(){
      if(seq&&seq!==window._affHighlightSeq)return;
      var el=document.querySelector('#affaires-content [data-deal-id="'+CSS.escape(String(dealId))+'"], #affaires-content-inner [data-deal-id="'+CSS.escape(String(dealId))+'"]');
      if(!el)return;
      el.classList.add('affaire-selected-v17');
      el.style.outline=HL;
      el.style.outlineOffset='3px';
      el.scrollIntoView({behavior:'smooth',block:'start'});
    },160);
  }
  window.openDealV213=function(dealId){
    if(!dealId)return;
    dealId=String(dealId);
    window.affairesFilter='ALL';
    window.affairesSearch='';
    window.affaireHighlightId=dealId;
    window.affaireSingleId=null;
    window._affHighlightSeq=(window._affHighlightSeq||0)+1;
    var seq=window._affHighlightSeq;
    var searchInp=byId('affaires-search-sticky')||byId('affaires-search');
    if(searchInp)searchInp.value='';
    try{if(typeof closeSheet==='function')closeSheet();}catch(e){}
    try{if(typeof showScreen==='function')showScreen('affaires');}catch(e){}
    setTimeout(function(){
      try{if(typeof renderAffaires==='function')renderAffaires();}catch(e){}
      highlightDeal(dealId,seq);
      setTimeout(function(){highlightDeal(dealId,seq);},520);
    },80);
  };
  window.openDealV27=function(id){window.openDealV213(id);};
  window.openDeal=function(id){window.openDealV213(id);};
  window.openDealFromCommission=function(id){if(id)window.openDealV213(id);};
  window.openDealForProjectId=function(pid){
    var ps;try{ps=DB.getProjects()||[];}catch(e){ps=[];}
    var p=ps.find(function(x){return String(x.id)===String(pid);});
    if(!p)return;
    var d=ensureDealForProject(p);
    if(d&&d.id)window.openDealV213(d.id);
  };
  var _raV24=window.renderAffaires;
  if(typeof _raV24==='function'&&!_raV24._v24NavWrap){
    window.renderAffaires=function(){
      if(window.affaireHighlightId)window.affairesFilter='ALL';
      var r=_raV24.apply(this,arguments);
      var hid=window.affaireHighlightId;
      if(hid&&!window._v24AffRetry){
        setTimeout(function(){
          var el=document.querySelector('#affaires-content [data-deal-id="'+CSS.escape(String(hid))+'"]');
          if(!el){
            window._v24AffRetry=true;
            window.affairesFilter='ALL';
            window.affairesSearch='';
            _raV24();
            window._v24AffRetry=false;
            highlightDeal(hid,window._affHighlightSeq);
          }
        },40);
      }
      return r;
    };
    window.renderAffaires._v24NavWrap=true;
  }
})();

// ===== STOCKAGE CANONIQUE AFFAIRES / LIVRAISONS (backup + restore unifiés) =====
(function(){
  var ARCH_LEGACY=['hotDealArchives','dealArchives'];
  var COMMERCE_KEYS=['hotDeals','deliveries','archivedHotDeals'].concat(ARCH_LEGACY);
  function mergeById(lists){
    var out=[], seen={};
    (lists||[]).forEach(function(list){
      (list||[]).forEach(function(x){
        if(!x)return;
        var id=x.id!=null?String(x.id):'';
        if(id){
          if(seen[id])return;
          seen[id]=true;
        }
        out.push(x);
      });
    });
    return out;
  }
  function readAll(key,legacy){
    legacy=legacy||[];
    var st={};
    try{st=DB.getSettings()||{};}catch(e){}
    var sources=[DB.get(key)];
    legacy.forEach(function(k){sources.push(DB.get(k));});
    sources.push(st[key]);
    legacy.forEach(function(k){sources.push(st[k]);});
    return mergeById(sources);
  }
  function writeAll(key,val,legacy){
    legacy=legacy||[];
    var arr=Array.isArray(val)?val:[];
    DB.set(key,arr);
    legacy.forEach(function(k){DB.set(k,arr);});
    var st={};
    try{st=DB.getSettings()||{};}catch(e){}
    var dirty=false;
    COMMERCE_KEYS.forEach(function(k){
      if(st[k]){delete st[k];dirty=true;}
    });
    if(dirty){try{DB.saveSettings(st);}catch(e){}}
    try{if(typeof autoSave==='function')autoSave();}catch(e){}
  }
  window.getHotDeals=function(){return readAll('hotDeals',[]);};
  window.saveHotDeals=function(v){writeAll('hotDeals',v,[]);};
  window.getDeliveries=function(){return readAll('deliveries',[]);};
  window.saveDeliveries=function(v){writeAll('deliveries',v,[]);};
  window.getArchivedHotDeals=function(){return readAll('archivedHotDeals',ARCH_LEGACY);};
  window.saveArchivedHotDeals=function(v){writeAll('archivedHotDeals',v,ARCH_LEGACY);};
  window.getHotDealArchives=window.getArchivedHotDeals;
  window.saveHotDealArchives=window.saveArchivedHotDeals;
  window.migrateCommerceStorage=function(){
    var hd=readAll('hotDeals',[]);
    var del=readAll('deliveries',[]);
    var ar=readAll('archivedHotDeals',ARCH_LEGACY);
    writeAll('hotDeals',hd,[]);
    writeAll('deliveries',del,[]);
    writeAll('archivedHotDeals',ar,ARCH_LEGACY);
  };
  window.migrateCommerceStorage();
})();
</script>
